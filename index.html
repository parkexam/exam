
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027년 공무원 시험합격</title>
<style>
:root {
  --navy:#183251;
  --blue:#326cdb;
  --bg:#f4f7fb;
  --ink:#23344c;
  --line:#e0e7f0;
  --muted:#718198;
  --green:#178366;
  --red:#c84e5b;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 system-ui,"Malgun Gothic",sans-serif
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
h1,h2,h3,p{margin:0}
h1{font-size:23px}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:15px;margin-bottom:9px}
small,.muted{color:var(--muted)}
.layout{display:flex;min-height:100vh}
.sidebar{
  background:var(--navy);color:white;
  width:225px;flex-shrink:0;padding:22px 13px
}
.brand{
  font-size:19px;font-weight:800;
  padding:10px 9px 24px;line-height:1.35
}
.brand small{
  display:block;color:#bbcee8;
  font-size:11px;margin-top:9px
}
.nav{display:grid;gap:6px}
.nav button{
  border:0;background:transparent;color:#c7d7eb;
  text-align:left;padding:12px;border-radius:9px;font-weight:700
}
.nav button.active,.nav button:hover{
  background:#38577c;color:white
}
.main{
  width:100%;max-width:1240px;
  margin:auto;padding:28px;min-width:0
}
.top{
  display:flex;justify-content:space-between;
  gap:12px;align-items:center;margin-bottom:18px
}
.top small{color:var(--muted)}
.card,.metric{
  background:white;border:1px solid var(--line);
  border-radius:15px;padding:18px;margin-top:14px
}
.metric{margin:0}
.grid3,.grid2{display:grid;gap:12px;margin-top:14px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric small{font-weight:750}
.big{font-size:28px;font-weight:850;line-height:1.4}
.big.money{font-size:23px}
.positive{color:var(--green)}
.negative{color:var(--red)}
.hero{
  background:linear-gradient(115deg,#193654,#3562a1);
  color:white;border-radius:16px;padding:21px;
  display:flex;justify-content:space-between;
  gap:12px;align-items:center
}
.hero p{color:#d4e1f4;font-size:12px}
.countdowns{display:flex;gap:10px}
.count{
  background:#ffffff19;border-radius:11px;
  padding:11px;text-align:center;min-width:133px
}
.count b{display:block;font-size:28px;line-height:1.3}
.count small{font-size:11px;color:#e0eafa}
.count.application b{color:#ffda91}
.progress{
  height:11px;background:#e7edf5;
  border-radius:99px;overflow:hidden;margin:10px 0
}
.progress i{
  height:100%;display:block;
  background:#4b82e8;border-radius:99px
}
.subjects{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(175px,1fr));
  gap:10px
}
.subject{
  border:1px solid var(--line);
  border-radius:11px;padding:12px
}
.subject small{font-size:12px}
.row{
  display:flex;align-items:center;
  justify-content:space-between;gap:10px;flex-wrap:wrap
}
.btn{
  border:1px solid #d4dfed;border-radius:9px;
  padding:9px 12px;background:white;
  color:#315171;font-weight:750
}
.btn.primary{
  background:var(--blue);color:white;
  border-color:var(--blue)
}
.btn.danger{color:var(--red)}
.btn.small{padding:5px 8px;font-size:12px}
.form{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:12px
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{
  font-weight:750;font-size:12px;color:#60738b
}
.field input,.field select{
  padding:10px;width:100%;min-width:0;
  border:1px solid #d7e1ed;
  border-radius:9px;background:white
}
.note{
  background:#eef4fc;border-radius:10px;
  padding:12px;color:#506b89;
  font-size:12px;margin-top:12px
}
.warn{background:#fff5e8;color:#855c22}
.list{display:grid;gap:6px}
.item{
  display:flex;justify-content:space-between;
  gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid #eef2f7
}
.item:last-child{border:0}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{
  text-align:left;padding:10px;
  border-bottom:1px solid #e9eef5;
  white-space:nowrap
}
th{color:var(--muted)}
.calendar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(235px,1fr));
  gap:12px
}
.month{
  border:1px solid var(--line);
  border-radius:11px;padding:12px
}
.days{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:3px
}
.day{
  height:29px;border:0;border-radius:5px;
  background:#e4efff;color:#3866aa;
  font-size:11px;padding:0
}
.day.head,.day.blank{
  background:transparent;color:#8595a9
}
.day.past{background:#e7eaf0;color:#9ba5b3}
.day.done{background:#cceede;color:#137252}
.day.partial{background:#ffedcc;color:#926119}
.day.rest{background:#efebf7;color:#8a79a0}
.day.exam{
  background:#d95565;color:white;font-weight:900
}
.day.today{
  outline:2px solid #285fcc;outline-offset:-2px
}
.day.apply{
  box-shadow:inset 0 0 0 3px #e9a325;
  font-weight:900
}
.legend{
  display:flex;gap:12px;flex-wrap:wrap;
  color:var(--muted);font-size:12px;margin:12px 0
}
.dot{
  display:inline-block;width:10px;height:10px;
  border-radius:2px;margin-right:4px
}
.status{
  font-size:12px;color:#bcd0e8;padding:10px
}
.login-wrap{
  max-width:440px;margin:10vh auto;padding:16px
}
.login-wrap .card{padding:26px}
.login-wrap .field{margin-top:12px}
.login-wrap button{width:100%;margin-top:16px}
.hidden{display:none!important}
.foot{
  color:var(--muted);font-size:12px;margin-top:18px
}
@media(max-width:800px){
  .layout{display:block}
  .sidebar{width:auto;padding:11px}
  .brand{font-size:17px;padding:3px 5px 10px}
  .brand small{display:none}
  .nav{display:flex;overflow:auto}
  .nav button{
    white-space:nowrap;font-size:12px;padding:9px
  }
  .main{padding:14px}
  .hero{flex-direction:column;align-items:stretch}
  .countdowns{width:100%}
  .count{flex:1;min-width:0}
  .count b{font-size:24px}
  .grid3{gap:7px}
  .metric{padding:11px 8px}
  .metric small{font-size:10px}
  .big{font-size:21px}
  .big.money{font-size:15px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="card">
    <h1>📚 2027년 공무원 시험합격</h1>
    <p class="muted" style="margin-top:8px">
      배우자와 함께 쓰는 실시간 학습 플래너
    </p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Firebase 로그인 이메일</label>
        <input id="email" type="email"
          autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password"
          autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit">
        로그인
      </button>
    </form>
    <p id="loginMessage" class="note">
      Firebase 설정 후 로그인할 수 있습니다.
    </p>
  </div>
</div>

<div id="app" class="layout hidden">
  <aside class="sidebar">
    <div class="brand">
      📚 2027년 공무원 시험합격
      <small>부부 공동 학습 플래너</small>
    </div>
    <nav id="nav" class="nav"></nav>
    <div id="syncStatus" class="status">
      연결 중...
    </div>
    <button id="logout" class="btn small"
      style="margin:6px 10px">
      로그아웃
    </button>
  </aside>
  <main class="main">
    <div id="view"></div>
    <p class="foot">
      학습 기록은 Firebase에 저장됩니다.
      가상 손익은 실제 수익·손실이 아닙니다.
    </p>
  </main>
</div>

<script type="module">
import {initializeApp}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
  getFirestore,
  doc,
  collection,
  getDoc,
  getDocs,
  setDoc,
  deleteDoc,
  writeBatch,
  onSnapshot
}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

// ★ 본인의 Firebase 설정값으로 교체하세요.
const firebaseConfig = {
  apiKey: '여기에_API_KEY',
  authDomain: '여기에_PROJECT_ID.firebaseapp.com',
  projectId: '여기에_PROJECT_ID',
  storageBucket: '여기에_STORAGE_BUCKET',
  messagingSenderId: '여기에_MESSAGING_SENDER_ID',
  appId: '여기에_APP_ID'
};

const SUBJECTS = {
  nurse:[
    '국어','영어','지역사회간호',
    '간호관리','LEET 추리논증'
  ],
  admin:[
    '국어','영어','행정법',
    '행정학','LEET 추리논증'
  ]
};

const ALL = [...new Set([
  ...SUBJECTS.nurse,...SUBJECTS.admin
])];

const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(
  /[&<>"']/g,
  c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c])
);

const fmt = n =>
  Math.round(n).toLocaleString('ko-KR');

const fmt1 = n =>
  Number(n).toLocaleString('ko-KR',{
    maximumFractionDigits:1
  });

const money = n =>
  (n>0?'+':n<0?'−':'')+
  fmt(Math.abs(n))+'원';

const uid = () => crypto.randomUUID();

const today = () => {
  let d=new Date();
  return `${d.getFullYear()}-${
    String(d.getMonth()+1).padStart(2,'0')
  }-${String(d.getDate()).padStart(2,'0')}`;
};

const dayNum = s => {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return NaN;
  let [y,m,d]=s.split('-').map(Number);
  let n=Date.UTC(y,m-1,d);
  let t=new Date(n);

  return t.getUTCFullYear()===y &&
    t.getUTCMonth()===m-1 &&
    t.getUTCDate()===d
    ? n/86400000 : NaN;
};

const diff = (a,b) => dayNum(b)-dayNum(a);

const fromDay = n =>
  new Date(n*86400000).toISOString().slice(0,10);

const dday = s => {
  let n=diff(today(),s);
  return n>0?'D-'+n:
    n===0?'D-DAY':'D+'+(-n);
};

const defaults = () => ({
  mode:'nurse',
  startDate:today(),
  targetDate:'2027-06-19',
  applicationDate:'2027-03-22',
  rounds:15,
  monthlySalary:220,
  monthlyChildcare:0,
  pastYears:0,
  pastAnnualCost:0,
  futureAnnualCost:100
});

const defaultPapers = () => {
  let a=[];

  for(let y=2016;y<=2026;y++){
    for(let s of ['국어','영어']){
      for(let type of ['국가직 9급','지방직 9급']){
        a.push({
          id:`p-${s}-${y}-${type}`,
          subject:s,
          year:y,
          type,
          questions:20
        });
      }
    }

    for(let s of [
      '지역사회간호','간호관리',
      '행정법','행정학'
    ]){
      a.push({
        id:`p-${s}-${y}-기출`,
        subject:s,
        year:y,
        type:'연도별 기출',
        questions:20
      });
    }
  }

  for(let y=2021;y<=2026;y++){
    a.push({
      id:`p-LEET-${y}`,
      subject:'LEET 추리논증',
      year:y,
      type:'추리논증',
      questions:40
    });
  }

  return a;
};

let auth,fire,user=null;
let tab='dashboard';
let unsubs=[];
let ready={};
let busy=false;

let state={
  settings:defaults(),
  papers:[],
  entries:[],
  rests:[]
};

let selectedSubject='국어';
let selectedPaper='';
let selectedDate=today();
let paperFilter='국어';

const refs = () => ({
  settings:doc(
    fire,'users',user.uid,'settings','main'
  ),
  papers:collection(
    fire,'users',user.uid,'papers'
  ),
  entries:collection(
    fire,'users',user.uid,'entries'
  ),
  rests:collection(
    fire,'users',user.uid,'rests'
  )
});

const sub = () =>
  SUBJECTS[state.settings.mode] || SUBJECTS.nurse;

const papers = () =>
  state.papers.filter(
    p=>sub().includes(p.subject)
  );

const entries = () =>
  state.entries.filter(
    e=>sub().includes(e.subject)
  );

const totalBase = () =>
  papers().reduce(
    (n,p)=>n+Number(p.questions||0),0
  );

const goal = () =>
  totalBase()*Number(state.settings.rounds||15);

const solved = () =>
  entries().reduce(
    (n,e)=>n+Number(e.count||0),0
  );

const onDay = s =>
  entries()
    .filter(e=>e.date===s)
    .reduce((n,e)=>n+Number(e.count||0),0);

const planDays = () =>
  Math.max(1,diff(
    state.settings.startDate,
    state.settings.targetDate
  )||1);

const dayGoal = () =>
  Math.max(1,Math.ceil(goal()/planDays()));

const daysLeft = () =>
  Math.max(0,diff(
    today(),state.settings.targetDate
  ));

const baseMoney = () =>
  Math.max(
    0,
    Number(state.settings.monthlySalary||0)-
    Number(state.settings.monthlyChildcare||0)
  )*10000/30;

const isRest = s => state.rests.includes(s);

const isStudyDay = s =>
  dayNum(s)>=dayNum(state.settings.startDate) &&
  dayNum(s)<dayNum(state.settings.targetDate);

const dailyProfit = s =>
  !isStudyDay(s)||isRest(s)
    ? 0
    : Math.round(
      baseMoney()*(onDay(s)/dayGoal()-1)
    );

const percent = (n,d) => d?100*n/d:0;

const bar = p => `
<div class="progress">
  <i style="width:${
    Math.min(100,Math.max(0,p))
  }%"></i>
</div>`;

const sessions = s => {
  let map=new Map(
    state.papers.map(p=>[p.id,p])
  );

  return state.entries
    .filter(e=>e.subject===s)
    .reduce((n,e)=>n+
      Number(e.count||0)/
      Math.max(1,Number(
        map.get(e.paperId)?.questions ||
        e.paperQuestions ||
        (s==='LEET 추리논증'?40:20)
      )),0);
};

const sessionGoal = s =>
  state.papers.filter(
    p=>p.subject===s
  ).length*state.settings.rounds;

function cumulative(){
  let a=dayNum(state.settings.startDate);
  let b=Math.min(
    dayNum(today()),
    dayNum(state.settings.targetDate)-1
  );
  let sum=0;

  if(!Number.isFinite(a)||
     !Number.isFinite(b))return 0;

  for(let i=a;i<=b&&i<a+3650;i++){
    sum+=dailyProfit(fromDay(i));
  }

  return sum;
}

function showLogin(message='전용 계정으로 로그인하세요.'){
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginMessage').textContent=message;
}

function showApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
}

function setStatus(s){
  if($('syncStatus')){
    $('syncStatus').textContent=s;
  }
}

function failure(e){
  console.error(e);
  alert('저장 또는 연결 오류: '+(e?.message||e));
}

function show(title,html){
  $('nav').innerHTML=[
    ['dashboard','◫ 대시보드'],
    ['log','✎ 풀이 기록'],
    ['calendar','▦ 시험 달력'],
    ['cost','₩ 기회비용'],
    ['settings','⚙ 설정·백업']
  ].map(([id,t])=>`
    <button data-tab="${id}"
      class="${tab===id?'active':''}">
      ${t}
    </button>
  `).join('');

  $('view').innerHTML=`
    <div class="top">
      <h1>${title}</h1>
      <small>${today()}</small>
    </div>
    ${html}
  `;
}

function hero(){
  return `
  <div class="hero">
    <div>
      <h2 style="margin:0 0 4px">
        2027년 공무원 시험합격
      </h2>
      <p>
        ${
          state.settings.mode==='nurse'
          ?'간호직':'일반행정직'
        }
        · ${state.settings.rounds}회독 목표
        · 누적 ${fmt(solved())}문항
      </p>
    </div>
    <div class="countdowns">
      <div class="count application">
        <b>${dday(state.settings.applicationDate)}</b>
        <small>
          원서접수 ·
          ${esc(state.settings.applicationDate)}
        </small>
      </div>
      <div class="count">
        <b>${dday(state.settings.targetDate)}</b>
        <small>
          필기시험 ·
          ${esc(state.settings.targetDate)}
        </small>
      </div>
    </div>
  </div>`;
}

function dashboard(){
  let count=onDay(today());
  let rate=percent(count,dayGoal());
  let profit=dailyProfit(today());
  let total=cumulative();
  let overall=percent(solved(),goal());

  let subjects=sub().map(s=>{
    let n=sessions(s);
    let g=sessionGoal(s);

    return `
    <div class="subject">
      <b>${esc(s)}</b>
      ${bar(percent(n,g))}
      <small>
        ${fmt1(n)} / ${fmt1(g)}회분
        · ${percent(n,g).toFixed(1)}%
      </small>
    </div>`;
  }).join('');

  let recent=entries()
    .slice()
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,6)
    .map(e=>`
      <div class="item">
        <span>
          ${esc(e.date)} · ${esc(e.subject)}
          · ${esc(e.year)} ${esc(e.type)}
        </span>
        <b>+${fmt(e.count)}문항</b>
      </div>
    `).join('')||
    '<p class="muted">아직 풀이 기록이 없습니다.</p>';

  show('오늘의 공부 현황',`
    ${hero()}

    <div class="grid3">
      <div class="metric">
        <small>당일 학습 진도율</small>
        <div class="big">${rate.toFixed(1)}%</div>
        <small>
          ${fmt(count)} / ${fmt(dayGoal())}문항
        </small>
      </div>

      <div class="metric">
        <small>일일 가상 손익</small>
        <div class="big money ${
          profit<0?'negative':'positive'
        }">${money(profit)}</div>
        <small>오늘 목표 대비</small>
      </div>

      <div class="metric">
        <small>누적 가상 손익</small>
        <div class="big money ${
          total<0?'negative':'positive'
        }">${money(total)}</div>
        <small>공부 시작일부터</small>
      </div>
    </div>

    <section class="card">
      <div class="row">
        <h2>전체 달성률</h2>
        <b>${overall.toFixed(2)}%</b>
      </div>

      ${bar(overall)}

      <div class="row">
        <b>
          ${fmt(solved())} / ${fmt(goal())}문항
        </b>
        <span class="muted">
          남은 ${
            fmt(Math.max(0,goal()-solved()))
          }문항
        </span>
      </div>

      <div class="note">
        1회독 ${fmt(totalBase())}문항 ·
        목표 ${state.settings.rounds}회독 ·
        남은 기간 하루 ${
          fmt(daysLeft()
            ?Math.ceil(
              Math.max(0,goal()-solved())/daysLeft()
            ):0)
        }문항 필요
      </div>
    </section>

    <section class="card">
      <div class="row">
        <h2>과목별 누적 진도</h2>
        <button class="btn small" data-tab="log">
          풀이 기록 →
        </button>
      </div>
      <div class="subjects">${subjects}</div>
    </section>

    <section class="card">
      <h2>최근 풀이 기록</h2>
      <div class="list">${recent}</div>

function monthHTML(y,m){
  let length=new Date(y,m+1,0).getDate();

  let h=`
    <div class="month">
      <h3>${y}년 ${m+1}월</h3>
      <div class="days">`;

  for(let w of ['일','월','화','수','목','금','토']){
    h+=`<span class="day head">${w}</span>`;
  }

  for(let i=0;i<new Date(y,m,1).getDay();i++){
    h+='<span class="day blank"></span>';
  }

  for(let d=1;d<=length;d++){
    let date=`${y}-${
      String(m+1).padStart(2,'0')
    }-${String(d).padStart(2,'0')}`;

    let n=onDay(date);

    let cls=
      date===state.settings.targetDate?'exam':
      isRest(date)?'rest':
      n>=dayGoal()?'done':
      n>0?'partial':
      date<today()?'past':'';

    h+=`
      <button
        class="day ${cls}
          ${date===today()?'today':''}
          ${
            date===state.settings.applicationDate
              ?'apply':''
          }"
        data-day="${date}"
        title="${date} · ${n}문항">
        ${d}
      </button>`;
  }

  return h+'</div></div>';
}

async function safeRun(task){
  if(busy)return;

  busy=true;
  setStatus('저장 중...');

  try{

function startListening(){
  ready={
    settings:false,
    papers:false,
    entries:false,
    rests:false
  };

  const r=refs();

  const fail=e=>{
    console.error(e);
    setStatus(
      '읽기 실패: Firestore 규칙과 네트워크를 확인하세요'
    );
  };

  unsubs.push(onSnapshot(r.settings,s=>{
    if(s.exists()){
      state.settings={
        ...defaults(),
        ...s.data()
      };
    }
    ready.settings=true;
    render();
  },fail));

  unsubs.push(onSnapshot(r.papers,s=>{
    state.papers=s.docs.map(
      d=>({id:d.id,...d.data()})
    );
    ready.papers=true;
    render();
  },fail));

  unsubs.push(onSnapshot(r.entries,s=>{
    state.entries=s.docs.map(
      d=>({id:d.id,...d.data()})
    );
    ready.entries=true;
    render();
  },fail));

  unsubs.push(onSnapshot(r.rests,s=>{
    state.rests=s.docs.map(d=>d.id);
    ready.rests=true;
    render();
  },fail));

  setStatus('실시간 동기화 연결됨');
}

async function initializeUser(){
  let r=refs();
  let s=await getDoc(r.settings);

  if(s.exists())return;

  let batch=writeBatch(fire);

  batch.set(r.settings,defaults());

  for(let p of defaultPapers()){
    let {id,...data}=p;
    batch.set(doc(r.papers,id),data);
  }

  await batch.commit();
}

  };
}

async function addEntry(){
  let p=state.papers.find(
    p=>p.id===$('logPaper').value
  );

  let date=$('logDate').value;
  let count=Number($('logCount').value);
  let raw=$('logCorrect').value;

  let correct=raw===''?null:Number(raw);

  if(
    !p||
    !sub().includes(p.subject)||
    !Number.isFinite(dayNum(date))||
    !Number.isInteger(count)||
    count<1||count>10000||
    correct!==null&&(
      !Number.isInteger(correct)||
      correct<0||correct>count
    )
  ){
    throw Error('풀이 기록 입력값을 확인하세요.');
  }

  let id=uid();

  await setDoc(doc(refs().entries,id),{
    date,
    paperId:p.id,
    paperQuestions:p.questions,
    subject:p.subject,
    year:p.year,
    type:p.type,
    count,
    correct,
    createdAt:new Date().toISOString()
  });

  selectedDate=date;
  selectedPaper=p.id;
}

function download(name,body,type){
  let u=URL.createObjectURL(
    new Blob(['\ufeff',body],{type})
  );

  let a=document.createElement('a');
  a.href=u;
  a.download=name;
  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

function normalizeBackup(x){
  if(!x||![3,4].includes(x.version)){
    throw Error('지원하지 않는 백업 파일입니다.');
  }

  let settings=x.version===3
    ?Object.fromEntries(
      Object.keys(defaults()).map(
        k=>[k,x[k]??defaults()[k]]
      )
    )
    :{...defaults(),...x.settings};

  let pp=x.papers;
  let ee=x.entries;
  let rr=x.restDates;

  if(
    !Array.isArray(pp)||
    !Array.isArray(ee)||
    !Array.isArray(rr)||
    !['nurse','admin'].includes(settings.mode)||
    !Number.isFinite(dayNum(settings.startDate))||
    !Number.isFinite(dayNum(settings.targetDate))||
    diff(settings.startDate,settings.targetDate)<=0||
    pp.length>10000||
    ee.length>100000
  ){
    throw Error('백업 내용이 올바르지 않습니다.');
  }

  settings.applicationDate=
    Number.isFinite(dayNum(settings.applicationDate))
    ?settings.applicationDate
    :'2027-03-22';

  settings.rounds=Number(settings.rounds)||15;

  const cleanId=id=>{
    let s=String(id||uid());

    if(s.includes('/')||s.length>200){
      throw Error('잘못된 기록 ID');
    }

    return s;
  };

  pp=pp.map(p=>{
    if(
      !ALL.includes(p.subject)||
      !Number.isInteger(Number(p.questions))||
      Number(p.questions)<1||
      Number(p.questions)>500
    ){
      throw Error('시험지 데이터 오류');
    }

    return {
      id:cleanId(p.id),
      subject:p.subject,
      year:Number(p.year),
      type:String(p.type||'기출').slice(0,80),
      questions:Number(p.questions)
    };
  });

  ee=ee.map(e=>{
    if(
      !ALL.includes(e.subject)||
      !Number.isFinite(dayNum(e.date))||
      !Number.isInteger(Number(e.count))||
      Number(e.count)<1||
      Number(e.count)>10000
    ){
      throw Error('풀이 기록 오류');
    }

    return {
      id:cleanId(e.id),
      date:e.date,
      paperId:String(e.paperId||''),
      paperQuestions:Number(e.paperQuestions||20),
      subject:e.subject,
      year:Number(e.year||2026),
      type:String(e.type||'기출').slice(0,80),
      count:Number(e.count),
      correct:e.correct==null
        ?null:Number(e.correct),
      createdAt:String(e.createdAt||'')
    };
  });

  rr=rr.filter(
    d=>Number.isFinite(dayNum(d))
  );

  return {
    settings,
    papers:pp,
    entries:ee,
    restDates:[...new Set(rr)]
  };
}

async function restoreCloud(data){
  let normalized=normalizeBackup(data);

  if(!confirm(
    '현재 클라우드의 모든 기록을 이 백업으로 교체할까요? 두 기기에 모두 반영됩니다.'
  ))return;

  let r=refs();

  let [ps,es,rs]=await Promise.all([
    getDocs(r.papers),
    getDocs(r.entries),
    getDocs(r.rests)
  ]);

  let ops=[];

  for(let snap of [ps,es,rs]){
    for(let d of snap.docs){
      ops.push({
        kind:'delete',
        ref:d.ref
      });
    }
  }

  ops.push({
    kind:'set',
    ref:r.settings,
    data:normalized.settings
  });

  for(let p of normalized.papers){
    let {id,...data}=p;

    ops.push({
      kind:'set',
      ref:doc(r.papers,id),
      data
    });
  }

  for(let e of normalized.entries){
    let {id,...data}=e;

    ops.push({
      kind:'set',
      ref:doc(r.entries,id),
      data
    });
  }

  for(let d of normalized.restDates){
    ops.push({
      kind:'set',
      ref:doc(r.rests,d),
      data:{rest:true}
    });
  }

  for(let i=0;i<ops.length;i+=350){
    let batch=writeBatch(fire);

    for(let o of ops.slice(i,i+350)){
      if(o.kind==='delete'){
        batch.delete(o.ref);
      }else{
        batch.set(o.ref,o.data);
      }
    }

    await batch.commit();
  }

  alert('클라우드 복원이 완료되었습니다.');
}

  'submit',

    }

    let btn=e.target.querySelector('button');

      );

          ?'이메일 또는 비밀번호를 확인하세요.'

    }finally{

document.addEventListener('click',e=>{
  let b=e.target.closest('button');
  if(!b||!user)return;

  let d=b.dataset;

  if(d.tab){
    go(d.tab);
    return;
  }

  if(d.day){
    selectedDate=d.day;
    go('log');
    return;
  }

  if(d.remove){
    if(confirm('이 풀이 기록을 삭제할까요?')){
      safeRun(
        ()=>deleteDoc(doc(refs().entries,d.remove))
      );
    }
    return;
  }

  if(d.editpaper){
    let p=state.papers.find(
      x=>x.id===d.editpaper
    );

    if(!p)return;

    let type=prompt('시험 종류',p.type);
    let q=type===null
      ?null:prompt('문항 수',p.questions);
    let y=q===null
      ?null:prompt('연도',p.year);

    if(y===null)return;

    if(
      !type.trim()||
      !Number.isInteger(+q)||
      +q<1||+q>500||
      !Number.isInteger(+y)||
      +y<1990||+y>2100
    ){
      return alert('입력값을 확인하세요.');
    }

    safeRun(
      ()=>setDoc(
        doc(refs().papers,p.id),
        {
          subject:p.subject,
          year:+y,
          type:type.trim(),
          questions:+q
        }
      )
    );
    return;
  }

  if(d.delpaper){
    if(confirm(
      '시험지를 삭제할까요? 기존 풀이 이력은 남습니다.'
    )){
      safeRun(
        ()=>deleteDoc(
          doc(refs().papers,d.delpaper)
        )
      );
    }
    return;
  }

  if('rest'in d){
    let date=$('restDate').value;

    if(!Number.isFinite(dayNum(date)))return;

    safeRun(
      ()=>isRest(date)
        ?deleteDoc(doc(refs().rests,date))
        :setDoc(
          doc(refs().rests,date),
          {rest:true}
        )
    );
    return;
  }

  if('backup'in d){
    download(
      'exam-cloud-backup-'+today()+'.json',
      JSON.stringify(backup(),null,2),
      'application/json'
    );
    return;
  }

  if('csv'in d){
    let rows=[
      [
        '날짜','과목','연도','시험',
        '풀이 문항','정답 문항'
      ],
      ...state.entries.map(x=>[
        x.date,x.subject,x.year,x.type,
        x.count,x.correct??''
      ])
    ];

    download(
      'exam-history.csv',
      rows.map(
        r=>r.map(
          x=>'"'+String(x).replace(/"/g,'""')+'"'
        ).join(',')
      ).join('\r\n'),
      'text/csv'
    );
    return;
  }

  if('migrate'in d){
    let raw=localStorage.getItem(
      'exam-15round-planner-v3'
    );

    if(raw){
      safeRun(
        ()=>restoreCloud(JSON.parse(raw))
      );
    }
    return;
  }

  if('reset'in d){
    if(
      !confirm('클라우드 기록을 모두 초기화할까요?')||
      !confirm(
        '마지막 확인입니다. 삭제 후 복구할 수 없습니다.'
      )
    )return;

    safeRun(
      async()=>{
        await restoreCloud({
          version:4,
          settings:defaults(),
          papers:defaultPapers(),
          entries:[],
          restDates:[]
        });
      }
    );
    return;
  }
});

document.addEventListener('change',async e=>{
  let x=e.target;
  if(!user)return;

  if(x.id==='logSubject'){
    selectedSubject=x.value;

    selectedPaper=state.papers.find(
      p=>p.subject===selectedSubject
    )?.id||'';

    $('logPaper').innerHTML=
      paperOptions(selectedSubject);

    $('logCount').value=state.papers.find(
      p=>p.id===selectedPaper
    )?.questions||20;

  }else if(x.id==='logPaper'){
    selectedPaper=x.value;

    $('logCount').value=state.papers.find(
      p=>p.id===selectedPaper
    )?.questions||20;

  }else if(x.id==='logDate'){
    selectedDate=x.value;

  }else if(x.id==='paperFilter'){
    paperFilter=x.value;
    render();

  }else if(
    x.id==='restoreFile'&&x.files?.[0]
  ){
    let file=x.files[0];

    await safeRun(
      async()=>restoreCloud(
        JSON.parse(await file.text())
      )
    );

    x.value='';
  }
});

document.addEventListener('submit',e=>{
  if(
    !user||
    ![
      'logForm','paperForm',
      'costForm','planForm'
    ].includes(e.target.id)
  )return;

  e.preventDefault();

  let id=e.target.id;

  safeRun(async()=>{
    if(id==='logForm'){
      await addEntry();
      return;
    }

    if(id==='paperForm'){
      let subject=$('paperSubject').value;
      let year=+$('paperYear').value;
      let type=$('paperType').value.trim();
      let questions=+$('paperQuestions').value;

      if(
        !sub().includes(subject)||
        !Number.isInteger(year)||
        year<1990||year>2100||
        !type||
        !Number.isInteger(questions)||
        questions<1||questions>500
      ){
        throw Error('시험지 입력값 오류');
      }

      if(state.papers.some(
        p=>p.subject===subject&&
        p.year===year&&
        p.type===type
      )){
        throw Error('이미 등록된 시험지입니다.');
      }

      await setDoc(
        doc(refs().papers,uid()),
        {subject,year,type,questions}
      );
      return;
    }

    if(id==='costForm'){
      let s={};

      for(let [f,k] of [
        ['salary','monthlySalary'],
        ['childcare','monthlyChildcare'],
        ['pastYears','pastYears'],
        ['pastAnnualCost','pastAnnualCost'],
        ['futureAnnualCost','futureAnnualCost']
      ]){
        let n=+$(f).value;

        if(
          !Number.isFinite(n)||
          n<0||n>5000
        ){
          throw Error('금액 입력값 오류');
        }

        s[k]=n;
      }

      await setDoc(
        refs().settings,s,{merge:true}
      );
      return;
    }

    if(id==='planForm'){
      let startDate=$('startDate').value;
      let targetDate=$('targetDate').value;
      let applicationDate=$('applicationDate').value;
      let rounds=+$('rounds').value;
      let mode=$('mode').value;

      if(
        !Number.isFinite(dayNum(startDate))||
        !Number.isFinite(dayNum(targetDate))||
        !Number.isFinite(dayNum(applicationDate))||
        diff(startDate,targetDate)<=0||
        !Number.isInteger(rounds)||
        rounds<1||rounds>1000||
        !SUBJECTS[mode]
      ){
        throw Error('계획 입력값 오류');
      }

      await setDoc(
        refs().settings,
        {
          startDate,
          targetDate,
          applicationDate,
          rounds,
          mode
        },
        {merge:true}
      );
    }
  });
});

if(
  firebaseConfig.apiKey.startsWith('여기에_')||
  firebaseConfig.projectId.startsWith('여기에_')
){
  showLogin(
    '먼저 index.html의 firebaseConfig를 본인 프로젝트 값으로 교체하세요.'
  );
}else{
  try{
    const app=initializeApp(firebaseConfig);

    auth=getAuth(app);
    fire=getFirestore(app);

    onAuthStateChanged(auth,async u=>{
      clearListening();
      user=u;

      if(!u){
        showLogin();
        return;
      }

      showApp();
      setStatus('초기 데이터 확인 중...');

      try{
        await initializeUser();

        if(auth.currentUser?.uid===u.uid){
          startListening();
        }
      }catch(err){
        console.error(err);
        setStatus('연결 오류');

        $('view').innerHTML=`
          <div class="card">
            Firestore 연결 실패:
            보안 규칙과 데이터베이스 생성 여부를
            확인하세요.
          </div>`;
      }
    });

  }catch(err){
    showLogin(
      'Firebase 설정 오류: '+err.message
    );
  }
}
