
<script>
/* 2027년 공무원 시험합격 - 화면 표시 수정 */
(() => {
  const originalRender = render;

  const fmt = value => Number.isInteger(value)
    ? value.toLocaleString('ko-KR')
    : value.toLocaleString('ko-KR', {
        maximumFractionDigits: 1
      });

  function updateLabels() {

    // 1. 웹페이지 제목 변경
    document.title = '2027년 공무원 시험합격';

    const brand = document.querySelector('.brand');

    if (brand) {
      brand.firstChild.textContent =
        '📚 2027년 공무원 시험합격';
    }

    // 2. 회독 전체 달성률 → 전체 달성률
    document.querySelectorAll(
      '#main h2, #main .metric .label'
    ).forEach(el => {

      if (
        el.textContent.includes('15회독 달성률') ||
        el.textContent.includes('회독 전체 달성률')
      ) {
        el.textContent = '전체 달성률';
      }

    });

    // 3. 과목별 누적 진도: 문항 → 회분
    document.querySelectorAll(
      '.subject-tile'
    ).forEach(tile => {

      const subject =
        tile.querySelector('b')?.textContent;

      const papers = db.papers.filter(
        p => p.subject === subject
      );

      const paperMap = new Map(
        papers.map(p => [p.id, p])
      );

      const goal =
        papers.length * Number(db.rounds);

      const completed = db.entries
        .filter(e =>
          e.subject === subject &&
          paperMap.has(e.paperId)
        )
        .reduce((sum, e) => {

          const questions =
            Number(
              paperMap.get(e.paperId).questions
            ) || 20;

          return sum +
            Number(e.count || 0) / questions;

        }, 0);

      const rate = goal
        ? completed / goal * 100
        : 0;

      const label =
        tile.querySelector('.nums');

      if (label) {
        label.textContent =
          `${fmt(completed)} / ${fmt(goal)}회분 · ${rate.toFixed(1)}%`;
      }

      const bar =
        tile.querySelector('.progress i');

      if (bar) {
        bar.style.width =
          `${Math.min(100, Math.max(0, rate))}%`;
      }

    });
  }

  // 메뉴를 바꾸거나 기록을 추가해도 자동 반영
  render = function() {
    originalRender();
    updateLabels();
  };

  render();

})();
</script>
