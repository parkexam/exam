
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2027년 공무원 시험합격</title>
<style>
:root{--navy:#172d4a;--blue:#346fe2;--bg:#f4f7fb;--line:#e2e8f1;--ink:#20334e;--muted:#708199;--green:#148367;--red:#c84d5c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,'Malgun Gothic',sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
h1{font-size:23px}
h2{font-size:18px;margin-bottom:12px}
h3{font-size:15px;margin-bottom:8px}
.app{display:flex;min-height:100vh}
.side{width:220px;flex-shrink:0;background:var(--navy);color:white;padding:24px 14px}
.brand{font-size:20px;font-weight:800;padding:8px 10px 24px}
.brand small{display:block;font-size:11px;color:#b6c9e4;margin-top:8px}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:#c7d6ea;padding:12px;text-align:left;border-radius:9px;font-weight:700}
.nav button.active,.nav button:hover{background:#345174;color:white}
.main{flex:1;min-width:0;max-width:1320px;padding:28px;margin:auto}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}
.top small,.muted{color:var(--muted)}
.hero{background:linear-gradient(115deg,#1b3555,#315d9c);color:white;border-radius:18px;padding:22px;display:flex;justify-content:space-between;gap:16px;align-items:center}
.hero p{color:#d4e1f5;font-size:12px}
.countdowns{display:flex;gap:10px}
.count{background:#ffffff18;padding:12px 14px;border-radius:12px;min-width:133px;text-align:center}
.count b{display:block;font-size:30px;line-height:1.25}
.count small{font-size:11px;color:#e1eaf8}
.count.apply b{color:#ffdb95}
.grid3,.grid2{display:grid;gap:13px;margin-top:14px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card,.metric{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;margin-top:15px}
.metric{margin:0}
.metric small{color:var(--muted);font-weight:700}
.big{font-size:28px;font-weight:850;line-height:1.5}
.money{font-size:24px}
.pos{color:var(--green)}
.neg{color:var(--red)}
.progress{height:11px;background:#e8eef7;border-radius:99px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#3473e8,#83a7f4);border-radius:99px}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}
.subject{border:1px solid var(--line);border-radius:11px;padding:12px}
.subject small{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{border:1px solid #d7e0ed;border-radius:9px;padding:9px 12px;background:white;color:#28466c;font-weight:750}
.btn.primary{background:var(--blue);border-color:var(--blue);color:white}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 8px;font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:750;font-size:12px;color:#586d88}
.field input,.field select{padding:10px;border:1px solid #d5e0ed;border-radius:9px;width:100%;background:white;min-width:0}
.note{background:#f0f5fd;color:#516985;padding:12px;border-radius:10px;font-size:12px;margin-top:12px}
.warn{background:#fff5e6;color:#825b25}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #edf1f5;padding:8px 0}
.item:last-child{border:0}
.tablewrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border-bottom:1px solid #edf1f5;padding:10px;text-align:left;white-space:nowrap}
th{color:#718098}
.calendar{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}
.month{border:1px solid var(--line);border-radius:12px;padding:12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.day{aspect-ratio:1.1;border:0;border-radius:6px;background:#e5efff;color:#3665a7;font-size:11px;padding:0}
.day.head,.day.blank{background:transparent;color:#7b8da3}
.day.past{background:#e8ebf0;color:#9ca6b3}
.day.done{background:#ccefe1;color:#0e7050}
.day.partial{background:#fff0d6;color:#916018}
.day.exam{background:#d64f61;color:white;font-weight:900}
.day.today{outline:2px solid #275fc9;outline-offset:-2px}
.day.apply{box-shadow:inset 0 0 0 3px #e8a12b;font-weight:900}
.day.rest{background:#f1edf8;color:#887c9d}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0;color:var(--muted);font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.foot{margin-top:18px;color:var(--muted);font-size:12px}
.hidden{display:none!important}
@media(max-width:780px){
.app{display:block}
.side{width:auto;padding:12px}
.brand{font-size:17px;padding:3px 5px 9px}
.brand small{display:none}
.nav{display:flex;overflow:auto;gap:5px}
.nav button{white-space:nowrap;font-size:12px;padding:9px}
.main{padding:14px}
.hero{flex-direction:column;align-items:stretch}
.countdowns{width:100%}
.count{flex:1;min-width:0;padding:10px 5px}
.count b{font-size:25px}
.count small{font-size:10px}
.grid3{gap:7px}
.metric{padding:11px 8px}
.metric small{font-size:10px}
.big{font-size:21px}
.money{font-size:15px}
.grid2{grid-template-columns:1fr}
.card{padding:15px}
.top h1{font-size:20px}
}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand">
📚 2027년 공무원 시험합격
<small>2027.06.19 필기시험 · 15회독 목표</small>
</div>
<nav id="nav" class="nav"></nav>
</aside>
<main class="main">
<div id="view"></div>
<p class="foot">● 학습 기록은 현재 브라우저에 자동 저장됩니다. 가상 손익은 실제 금전적 손익이 아닙니다.</p>
</main>
</div>
<script>
'use strict';

const KEY='exam-15round-planner-v3';
const APPLICATION='2027-03-22';

const SUBJECTS={
 nurse:['국어','영어','지역사회간호','간호관리','LEET 추리논증'],
 admin:['국어','영어','행정법','행정학','LEET 추리논증']
};
const ALL=[...new Set([...SUBJECTS.nurse,...SUBJECTS.admin])];
const $=id=>document.getElementById(id);

const today=()=>{
 let d=new Date();
 return [
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,'0'),
  String(d.getDate()).padStart(2,'0')
 ].join('-');
};

const numDate=s=>{
 let d=new Date(s+'T12:00:00');
 return /^\d{4}-\d\d-\d\d$/.test(s||'') &&
 !isNaN(d) &&
 d.toISOString().slice(0,10)===s
 ? Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000
 : NaN;
};

const diff=(a,b)=>numDate(b)-numDate(a);
const dateFrom=n=>new Date(n*86400000).toISOString().slice(0,10);
const dd=s=>{
 let d=diff(today(),s);
 return d>0?'D-'+d:d===0?'D-DAY':'D+'+(-d);
};
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const fmt1=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1});
const money=n=>(n>0?'+':n<0?'−':'')+fmt(Math.abs(n))+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function makePapers(){
 let a=[];
 const add=(subject,year,type,questions)=>
  a.push({id:uid(),subject,year,type,questions});

 for(let y=2016;y<=2026;y++){
  for(let s of ['국어','영어']){
   add(s,y,'국가직 9급',20);
   add(s,y,'지방직 9급',20);
  }
  for(let s of ['지역사회간호','간호관리','행정법','행정학']){
   add(s,y,'연도별 기출',20);
  }
 }
 for(let y=2021;y<=2026;y++){
  add('LEET 추리논증',y,'추리논증',40);
 }
 return a;
}

function defaults(){
 return {
  version:3,
  mode:'nurse',
  startDate:today(),
  targetDate:'2027-06-19',
  isOfficialExamDate:true,
  rounds:15,
  monthlySalary:220,
  monthlyChildcare:0,
  pastYears:0,
  pastAnnualCost:0,
  futureAnnualCost:100,
  papers:makePapers(),
  entries:[],
  restDates:[]
 };
}

let db;
try{
 db=JSON.parse(localStorage.getItem(KEY));
}catch(e){}

if(!db||db.version!==3||!Array.isArray(db.papers)||!Array.isArray(db.entries)){
 db=defaults();
}
if(!Array.isArray(db.restDates))db.restDates=[];

const save=()=>{
 try{
  localStorage.setItem(KEY,JSON.stringify(db));
 }catch(e){
  alert('저장에 실패했습니다. JSON 백업을 이용해 주세요.');
 }
};

const subs=()=>SUBJECTS[db.mode]||SUBJECTS.nurse;
const papers=()=>db.papers.filter(p=>subs().includes(p.subject));
const entries=()=>db.entries.filter(e=>subs().includes(e.subject));
const totalBase=()=>papers().reduce((n,p)=>n+Number(p.questions||0),0);
const goal=()=>totalBase()*Number(db.rounds||15);
const solved=()=>entries().reduce((n,e)=>n+Number(e.count||0),0);
const onDay=s=>entries().filter(e=>e.date===s).reduce((n,e)=>n+Number(e.count||0),0);
const planDays=()=>Math.max(1,diff(db.startDate,db.targetDate)||1);
const dayGoal=()=>Math.max(1,Math.ceil(goal()/planDays()));
const daysLeft=()=>Math.max(0,diff(today(),db.targetDate));
const dailyBase=()=>Math.max(
 0,
 Number(db.monthlySalary||0)-Number(db.monthlyChildcare||0)
)*10000/30;
const rest=s=>db.restDates.includes(s);
const activeDay=s=>numDate(s)>=numDate(db.startDate)&&numDate(s)<numDate(db.targetDate);
const dailyProfit=s=>!activeDay(s)||rest(s)
 ? 0
 : Math.round(dailyBase()*(onDay(s)/dayGoal()-1));

function cumulative(){
 let a=numDate(db.startDate);
 let b=Math.min(numDate(today()),numDate(db.targetDate)-1);
 let sum=0;
 if(!Number.isFinite(a)||!Number.isFinite(b))return 0;
 for(let i=a;i<=b&&i<a+3650;i++){
  sum+=dailyProfit(dateFrom(i));
 }
 return sum;
}

const pct=(n,d)=>d?100*n/d:0;
const bar=p=>`<div class="progress"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`;

function sessions(s){
 let m=new Map(db.papers.map(p=>[p.id,p]));
 return db.entries.filter(e=>e.subject===s).reduce(
  (sum,e)=>sum+Number(e.count||0)/
  (Number(m.get(e.paperId)?.questions)||(s==='LEET 추리논증'?40:20)),
  0
 );
}
const sessionGoal=s=>db.papers.filter(p=>p.subject===s).length*db.rounds;

let tab='dashboard';
let chosenSubject='국어';
let chosenPaper='';
let chosenDate=today();
let paperFilter='국어';

function showPage(title,content){
 $('nav').innerHTML=[
  ['dashboard','◫ 대시보드'],
  ['log','✎ 풀이 기록'],
  ['calendar','▦ 시험 달력'],
  ['cost','₩ 기회비용'],
  ['settings','⚙ 설정·백업']
 ].map(([id,t])=>`
  <button data-tab="${id}" class="${tab===id?'active':''}">${t}</button>
 `).join('');

 $('view').innerHTML=`
  <div class="top">
   <h1>${title}</h1>
   <small>${today()}</small>
  </div>
  ${content}
 `;
}

const hero=()=>`
<div class="hero">
 <div>
  <h2 style="margin:0 0 4px">2027년 공무원 시험합격</h2>
  <p>${db.mode==='nurse'?'간호직':'일반행정직'} · ${db.rounds}회독 목표 · 누적 ${fmt(solved())}문항</p>
 </div>
 <div class="countdowns">
  <div class="count apply">
   <b>${dd(APPLICATION)}</b>
   <small>원서접수 · 2027.03.22</small>
  </div>
  <div class="count">
   <b>${dd(db.targetDate)}</b>
   <small>필기시험 · ${esc(db.targetDate)}</small>
  </div>
 </div>
</div>`;

function dashboard(){
 let count=onDay(today());
 let rate=pct(count,dayGoal());
 let profit=dailyProfit(today());
 let total=cumulative();
 let overall=pct(solved(),goal());

 let subhtml=subs().map(s=>{
  let n=sessions(s),g=sessionGoal(s);
  return `
  <div class="subject">
   <b>${esc(s)}</b>
   ${bar(pct(n,g))}
   <small>${fmt1(n)} / ${fmt1(g)}회분 · ${pct(n,g).toFixed(1)}%</small>
  </div>`;
 }).join('');

 let recent=entries().slice()
  .sort((a,b)=>b.date.localeCompare(a.date))
  .slice(0,5)
  .map(e=>`
   <div class="item">
    <span>${esc(e.date)} · ${esc(e.subject)} · ${esc(e.year)} ${esc(e.type)}</span>
    <b>+${fmt(e.count)}문항</b>
   </div>
  `).join('')||'<p class="muted">아직 기록이 없습니다.</p>';

 showPage('오늘의 공부 현황',`
 ${hero()}
 <div class="grid3">
  <div class="metric">
   <small>당일 학습 진도율</small>
   <div class="big">${rate.toFixed(1)}%</div>
   <small>${fmt(count)} / ${fmt(dayGoal())}문항</small>
  </div>
  <div class="metric">
   <small>일일 가상 손익</small>
   <div class="big money ${profit<0?'neg':'pos'}">${money(profit)}</div>
   <small>오늘 목표 대비</small>
  </div>
  <div class="metric">
   <small>누적 가상 손익</small>
   <div class="big money ${total<0?'neg':'pos'}">${money(total)}</div>
   <small>공부 시작일부터</small>
  </div>
 </div>

 <section class="card">
  <div class="row">
   <h2>전체 달성률</h2>
   <b>${overall.toFixed(2)}%</b>
  </div>
  ${bar(overall)}
  <div class="row">
   <b>${fmt(solved())} / ${fmt(goal())}문항</b>
   <span class="muted">남은 ${fmt(Math.max(0,goal()-solved()))}문항</span>
  </div>
  <div class="note">
   1회독 ${fmt(totalBase())}문항 · 목표 ${db.rounds}회독 ·
   남은 기간 하루 ${fmt(daysLeft()?Math.ceil(Math.max(0,goal()-solved())/daysLeft()):0)}문항 필요
  </div>
 </section>

 <section class="card">
  <div class="row">
   <h2>과목별 누적 진도</h2>
   <button class="btn sm" data-tab="log">풀이 기록 →</button>
  </div>
  <div class="subjects">${subhtml}</div>
 </section>

 <section class="card">
  <h2>최근 풀이 기록</h2>
  <div class="list">${recent}</div>
 </section>

 <section class="card">
  <div class="note warn">
   일일 가상 손익 = (오늘 풀이 문항 ÷ 하루 목표 − 1) × 하루 기준금액.
   휴식일은 0원으로 계산하고, 오늘의 금액은 학습 중인 잠정값입니다.
  </div>
 </section>
 `);
}

function paperOptions(s){
 return db.papers.filter(p=>p.subject===s)
 .sort((a,b)=>b.year-a.year||a.type.localeCompare(b.type))
 .map(p=>`
  <option value="${esc(p.id)}" ${p.id===chosenPaper?'selected':''}>
   ${p.year} ${esc(p.type)} (${p.questions}문항)
  </option>
 `).join('');
}

function logView(){
 if(!subs().includes(chosenSubject))chosenSubject=subs()[0];
 let ps=db.papers.filter(p=>p.subject===chosenSubject);
 if(!ps.some(p=>p.id===chosenPaper))chosenPaper=ps[0]?.id||'';
 if(!subs().includes(paperFilter))paperFilter=subs()[0];

 let selected=db.papers.find(p=>p.id===chosenPaper);

 let list=db.entries.filter(e=>subs().includes(e.subject))
 .slice().sort((a,b)=>b.date.localeCompare(a.date))
 .slice(0,100).map(e=>`
  <tr>
   <td>${esc(e.date)}</td>
   <td>${esc(e.subject)}</td>
   <td>${esc(e.year)} ${esc(e.type)}</td>
   <td>${fmt(e.count)}</td>
   <td>${e.correct==null?'—':fmt(e.correct)}</td>
   <td><button class="btn sm danger" data-remove="${esc(e.id)}">삭제</button></td>
  </tr>
 `).join('');

 let paperList=db.papers.filter(p=>p.subject===paperFilter)
 .sort((a,b)=>b.year-a.year||a.type.localeCompare(b.type))
 .map(p=>`
  <div class="item">
   <span>${p.year}년 ${esc(p.type)} · ${p.questions}문항</span>
   <span>
    <button class="btn sm" data-editpaper="${esc(p.id)}">수정</button>
    <button class="btn sm danger" data-delpaper="${esc(p.id)}">삭제</button>
   </span>
  </div>
 `).join('');

 showPage('기출문제 풀이 기록',`
 <section class="card">
  <h2>풀이 횟수 누적 등록</h2>
  <p class="muted">같은 기출을 여러 번 풀어도 매번 기록할 수 있습니다.</p>
  <form id="logForm" class="form" style="margin-top:12px">
   <div class="field">
    <label>날짜</label>
    <input id="logDate" type="date" value="${chosenDate}" required>
   </div>
   <div class="field">
    <label>과목</label>
    <select id="logSubject">
     ${subs().map(s=>`<option ${s===chosenSubject?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
   </div>
   <div class="field">
    <label>시험지</label>
    <select id="logPaper">${paperOptions(chosenSubject)}</select>
   </div>
   <div class="field">
    <label>푼 문항 수</label>
    <input id="logCount" type="number" min="1" max="10000" value="${selected?.questions||20}" required>
   </div>
   <div class="field">
    <label>맞힌 문항 수 (선택)</label>
    <input id="logCorrect" type="number" min="0" placeholder="미입력 가능">
   </div>
   <div class="field">
    <label>&nbsp;</label>
    <button class="btn primary" type="submit">풀이 기록 추가</button>
   </div>
  </form>
 </section>

 <section class="card">
  <h2>최근 풀이 이력</h2>
  <div class="tablewrap">
   <table>
    <thead>
     <tr>
      <th>날짜</th><th>과목</th><th>시험지</th>
      <th>풀이</th><th>정답</th><th>관리</th>
     </tr>
    </thead>
    <tbody>${list||'<tr><td colspan="6">기록이 없습니다.</td></tr>'}</tbody>
   </table>
  </div>
 </section>

 <section class="card">
  <h2>시험지 구성 관리</h2>
  <div class="field" style="max-width:230px;margin-bottom:12px">
   <label>관리할 과목</label>
   <select id="paperFilter">
    ${subs().map(s=>`<option ${s===paperFilter?'selected':''}>${esc(s)}</option>`).join('')}
   </select>
  </div>
  <div class="list">${paperList}</div>
  <h3 style="margin-top:20px">새로운 시험지 추가 (7급 기출 포함)</h3>
  <form id="paperForm" class="form">
   <div class="field">
    <label>과목</label>
    <select id="paperSubject">
     ${subs().map(s=>`<option ${s===paperFilter?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
   </div>
   <div class="field">
    <label>연도</label>
    <input id="paperYear" type="number" min="1990" max="2100" value="2026" required>
   </div>
   <div class="field">
    <label>시험 종류</label>
    <input id="paperType" value="국가직 7급" required>
   </div>

function monthHTML(y,m){
 let first=new Date(y,m,1);
 let length=new Date(y,m+1,0).getDate();
 let h=`<div class="month"><h3>${y}년 ${m+1}월</h3><div class="days">`;

 for(let w of ['일','월','화','수','목','금','토']){
  h+=`<span class="day head">${w}</span>`;
 }
 for(let i=0;i<first.getDay();i++){
  h+='<span class="day blank"></span>';
 }
 for(let d=1;d<=length;d++){
  let date=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let n=onDay(date);
  let cls=date===db.targetDate?'exam':
   rest(date)?'rest':
   n>=dayGoal()?'done':
   n>0?'partial':
   date<today()?'past':'';

  h+=`
   <button
    class="day ${cls} ${date===today()?'today':''} ${date===APPLICATION?'apply':''}"
    data-day="${date}"
    title="${date} · ${n}문항${date===APPLICATION?' · 원서접수일':''}">
    ${d}
   </button>`;
 }
 return h+'</div></div>';
}

function render(){
 if(tab==='dashboard')dashboard();
 else if(tab==='log')logView();
 else if(tab==='calendar')calendarView();
 else if(tab==='cost')costView();
 else settingsView();
}

function go(t){
 tab=t;
 render();
 scrollTo(0,0);
}

function download(name,text,type){
 let url=URL.createObjectURL(new Blob(['\ufeff',text],{type}));
 let a=document.createElement('a');
 a.href=url;
 a.download=name;
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

document.addEventListener('click',e=>{
 let b=e.target.closest('button');
 if(!b)return;
 let d=b.dataset;

 if(d.tab){
  go(d.tab);
  return;
 }
 if(d.day){
  chosenDate=d.day;
  go('log');
  return;
 }
 if(d.remove){
  if(confirm('이 풀이 기록을 삭제할까요?')){
   db.entries=db.entries.filter(x=>x.id!==d.remove);
   save();
   render();
  }
  return;
 }
 if(d.editpaper){
  let p=db.papers.find(x=>x.id===d.editpaper);
  if(!p)return;
  let t=prompt('시험 종류',p.type);
  if(t===null)return;
  let q=prompt('문항 수',p.questions);
  if(q===null)return;
  let y=prompt('연도',p.year);
  if(y===null)return;
  if(!t.trim()||!Number.isInteger(+q)||+q<1||+q>500||!Number.isInteger(+y)){
   alert('입력값을 확인하세요.');
   return;
  }
  Object.assign(p,{type:t.trim(),questions:+q,year:+y});
  save();
  render();
  return;
 }
 if(d.delpaper){
  if(confirm('이 시험지를 삭제할까요? 기존 풀이 기록은 유지됩니다.')){
   db.papers=db.papers.filter(x=>x.id!==d.delpaper);
   save();
   render();
  }
  return;
 }
 if('rest'in d){
  let x=$('restDate').value;
  if(!Number.isFinite(numDate(x)))return;
  db.restDates=rest(x)
   ?db.restDates.filter(s=>s!==x)
   :[...db.restDates,x];
  save();
  render();
  return;
 }
 if('backup'in d){
  download('exam-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');
  return;
 }
 if('csv'in d){
  let rows=[
   ['날짜','과목','연도','시험','풀이 문항','정답 문항'],
   ...db.entries.map(x=>[x.date,x.subject,x.year,x.type,x.count,x.correct??''])
  ];
  download(
   'exam-history.csv',
   rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),
   'text/csv'
  );
  return;
 }
 if('reset'in d&&confirm('정말 모든 기록을 초기화할까요?')&&confirm('삭제한 기록은 복구할 수 없습니다. 계속할까요?')){
  db=defaults();
  save();
  go('dashboard');
 }
});

document.addEventListener('change',async e=>{
 let x=e.target;
 if(x.id==='logSubject'){
  chosenSubject=x.value;
  chosenPaper=db.papers.find(p=>p.subject===chosenSubject)?.id||'';
  let p=db.papers.find(p=>p.id===chosenPaper);
  $('logPaper').innerHTML=paperOptions(chosenSubject);
  $('logCount').value=p?.questions||20;
 }else if(x.id==='logPaper'){
  chosenPaper=x.value;
  $('logCount').value=db.papers.find(p=>p.id===chosenPaper)?.questions||20;
 }else if(x.id==='logDate'){
  chosenDate=x.value;
 }else if(x.id==='paperFilter'){
  paperFilter=x.value;
  render();
 }else if(x.id==='restore'){
  let file=x.files?.[0];
  if(!file)return;
  try{
   let data=JSON.parse(await file.text());
   if(data.version!==3||
      !Array.isArray(data.entries)||
      !Array.isArray(data.papers)||
      !['nurse','admin'].includes(data.mode)){
    throw Error('지원하지 않는 백업 파일');
   }
   if(!confirm('현재 데이터를 백업 파일로 교체할까요?'))return;
   db=data;
   db.restDates??=[];
   save();
   go('dashboard');
  }catch(err){
   alert('복원 실패: '+err.message);
  }
 }
});

document.addEventListener('submit',e=>{
 e.preventDefault();
 let id=e.target.id;

 try{
  if(id==='logForm'){
   let p=db.papers.find(p=>p.id===$('logPaper').value);
   let count=Number($('logCount').value);
   let date=$('logDate').value;
   let correct=$('logCorrect').value;

   if(!p||
      !Number.isInteger(count)||
      count<1||
      count>10000||
      !Number.isFinite(numDate(date))||
      (correct!==''&&(!Number.isInteger(+correct)||+correct<0||+correct>count))){
    throw Error('풀이 입력값을 확인하세요.');
   }

   db.entries.push({
    id:uid(),
    date,
    paperId:p.id,
    subject:p.subject,
    year:p.year,
    type:p.type,
    count,
    correct:correct===''?null:+correct,
    createdAt:new Date().toISOString()
   });
   chosenDate=date;
   chosenPaper=p.id;
   save();
   render();
   alert(count+'문항이 누적되었습니다.');

  }else if(id==='paperForm'){
   let subject=$('paperSubject').value;
   let year=+$('paperYear').value;
   let type=$('paperType').value.trim();
   let questions=+$('paperQuestions').value;

   if(!subs().includes(subject)||
      !Number.isInteger(year)||
      year<1990||year>2100||
      !type||
      !Number.isInteger(questions)||
      questions<1||questions>500){
    throw Error('시험지 입력값을 확인하세요.');
   }
   if(db.papers.some(p=>p.subject===subject&&p.year===year&&p.type===type)){
    throw Error('이미 등록된 시험지입니다.');
   }

   db.papers.push({id:uid(),subject,year,type,questions});
   paperFilter=subject;
   save();
   render();

  }else if(id==='costForm'){
   for(let [field,key] of [
    ['salary','monthlySalary'],
    ['childcare','monthlyChildcare'],
    ['pastYears','pastYears'],
    ['pastAnnualCost','pastAnnualCost'],
    ['futureAnnualCost','futureAnnualCost']
   ]){
    let v=Number($(field).value);
    if(!Number.isFinite(v)||v<0||v>5000){
     throw Error('금액 입력값을 확인하세요.');
    }
    db[key]=v;
   }
   save();
   render();

  }else if(id==='planForm'){
   let start=$('startDate').value;
   let end=$('targetDate').value;
   let rounds=+$('rounds').value;

   if(!Number.isFinite(numDate(start))||
      !Number.isFinite(numDate(end))||
      diff(start,end)<=0||
      !Number.isInteger(rounds)||
      rounds<1||rounds>1000){
    throw Error('학습 기간과 회독 수를 확인하세요.');
   }

   Object.assign(db,{
    mode:$('mode').value,
    startDate:start,
    targetDate:end,
    rounds,
    isOfficialExamDate:true
   });
   save();
   render();
  }
 }catch(err){
  alert(err.message);
 }
});

save();
render();
</script>
