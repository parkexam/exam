<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #87b4ff;outline-offset:2px}h1,h2,h3,p{margin:0}h1{font-size:25px;letter-spacing:-.9px}h2{font-size:19px;letter-spacing:-.45px}h3{font-size:15px}small,.muted{color:var(--muted)}.app{display:flex;min-height:100vh}.sidebar{background:var(--navy);color:#fff;width:224px;flex:0 0 224px;padding:29px 15px;position:sticky;top:0;height:100vh}.brand{padding:5px 13px 29px;font-size:21px;font-weight:800;line-height:1.35;letter-spacing:-.6px}.brand span{display:block;font-size:11px;color:#a9c0e1;letter-spacing:.7px;margin-top:7px;font-weight:600}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:11px;background:transparent;color:#c7d5e8;text-align:left;padding:12px 13px;font-weight:650}.nav button.active,.nav button:hover{background:#2c486d;color:#fff}.sidebar-foot{margin:28px 12px;color:#9db0cb;font-size:11px;line-height:1.8}.main{width:100%;max-width:1300px;margin:0 auto;padding:32px 32px 64px;min-width:0}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:1.3px;font-weight:800;color:#5273a1}.date-pill{border:1px solid #d8e2f0;background:#fff;border-radius:999px;padding:8px 14px;color:#4f6685;font-size:12px;font-weight:700}.hero{background:linear-gradient(125deg,#193352,#315d9b);color:#fff;border-radius:20px;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:var(--shadow);margin-bottom:18px}.hero h2{font-size:24px;margin:4px 0 6px}.hero p{color:#c9daf0;font-size:13px}.hero-stat{text-align:right;min-width:135px}.hero-stat strong{font-size:38px;letter-spacing:-1.5px;display:block;line-height:1.2}.hero-stat span{font-size:12px;color:#d4e2f3}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.metric,.card{background:#fff;border:1px solid #e8edf5;border-radius:17px;box-shadow:var(--shadow)}.metric{padding:19px 20px;min-height:130px}.metric .label{font-size:12px;color:var(--muted);font-weight:700}.metric .value{font-size:29px;font-weight:850;letter-spacing:-1.2px;line-height:1.45;white-space:nowrap}.metric .value.money{font-size:25px}.metric .sub{font-size:12px;color:#73829a}.metric.positive .value{color:var(--green)}.metric.negative .value{color:var(--red)}.card{padding:22px;margin-top:17px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.section-head p{font-size:12px;color:var(--muted)}.progress{height:11px;border-radius:99px;background:#e7edf6;overflow:hidden}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#306de4,#6c9af4)}.progress.green i{background:#20a078}.progress-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:10px 0 8px}.progress-top b{font-size:19px}.progress-top span{color:var(--muted);font-size:12px}.subjects-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.subject-tile{border:1px solid var(--line);border-radius:12px;padding:13px}.subject-tile b{display:block;margin-bottom:7px}.subject-tile .nums{font-size:12px;color:var(--muted);margin:8px 0 0}.tag{display:inline-block;border-radius:7px;padding:3px 8px;font-size:11px;font-weight:800;background:#eaf1ff;color:#2d62c0}.tag.gray{background:#f1f3f6;color:#67778d}.tag.green{background:#e4f5ef;color:#16765b}.tag.red{background:#fff0f1;color:#c24c5b}.btn{background:#fff;border:1px solid #d6e0ec;border-radius:9px;padding:9px 13px;color:#27415f;font-weight:750;white-space:nowrap}.btn:hover{background:#f1f5fb}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.primary:hover{background:#205aca}.btn.danger{color:var(--red)}.btn.small{font-size:12px;padding:6px 9px}.btn.full{width:100%}.button-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;font-weight:800;color:#52657d}.field input,.field select,.field textarea{width:100%;border:1px solid #d8e0ec;border-radius:9px;background:#fff;padding:10px 11px;min-width:0;color:#233851}.field input[type=checkbox]{width:auto}.field textarea{min-height:90px}.note{background:#f0f5fc;color:#536b89;border-radius:11px;padding:12px 14px;font-size:12px;line-height:1.7}.note.warn{background:#fff6e9;color:#875e24}.note.good{background:#e9f7f1;color:#17684f}.inline-stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.inline-stat span{background:#f3f6fa;border-radius:8px;padding:7px 10px;font-size:12px;color:#5c6e86}.table-scroll{overflow:auto}.data-table{width:100%;border-collapse:collapse;font-size:13px}.data-table th{text-align:left;color:#718098;font-size:11px;padding:10px;border-bottom:1px solid #dce5ef;white-space:nowrap}.data-table td{padding:11px 10px;border-bottom:1px solid #edf0f5;vertical-align:middle}.data-table tr:last-child td{border-bottom:0}.data-table .right{text-align:right}.paper-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px}.paper{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.paper strong{display:block;font-size:13px}.paper small{display:block;font-size:11px}.paper-actions{display:flex;gap:4px}.paper-actions .btn{padding:5px 7px;font-size:11px}.cal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.month{border:1px solid #e0e7f0;border-radius:12px;padding:13px;min-width:0}.month h3{margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}.month h3 small{font-weight:400}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.day{display:flex;align-items:center;justify-content:center;aspect-ratio:1.18;border-radius:6px;font-size:11px;background:#e5efff;color:#3763a6;border:0;padding:0;position:relative}.day.head{background:transparent;color:#8a96a9;font-weight:750;aspect-ratio:auto;padding:4px 0}.day.blank{background:transparent}.day.past{background:#e8ebf0;color:#a4aab5}.day.done{background:#cceee1;color:#116f53}.day.partial{background:#fff0d6;color:#946019}.day.exam{background:#dd5261;color:#fff;font-weight:900}.day.today{outline:2px solid #2e65ce;outline-offset:-2px;font-weight:900}.day.rest{background:#f2f2f8;color:#8a8aa1}.day:hover:not(.head):not(.blank){filter:brightness(.94);cursor:pointer}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 17px;font-size:12px;color:#728198}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}.bar-chart{display:flex;align-items:end;gap:7px;height:130px;margin:16px 0 4px;border-bottom:1px solid #e4eaf2;padding-bottom:3px}.bar-col{flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:4px;min-width:0;height:100%}.bar-col i{width:min(100%,35px);border-radius:5px 5px 0 0;background:#8aadef;min-height:2px}.bar-col i.hit{background:#36a889}.bar-col span{font-size:10px;color:#7b8899}.money-big{font-size:30px;letter-spacing:-1px;font-weight:900}.money-big.positive{color:var(--green)}.money-big.negative{color:var(--red)}.mini-list{display:grid;gap:9px}.mini-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #edf1f5;padding:7px 0;font-size:13px}.mini-row:last-child{border:0}.mini-row strong{white-space:nowrap}.empty{text-align:center;color:#8b9bb0;padding:22px 8px}.footer-note{font-size:12px;color:#71839c;margin-top:19px}.status{font-size:12px;color:#7d90a9}.mobile-nav{display:none}details{border-top:1px solid #edf1f6;padding:13px 0}details summary{font-weight:800;cursor:pointer}.danger-zone{border:1px solid #f2d9df;border-radius:12px;padding:13px}.hidden{display:none!important}
@media(max-width:1000px){.sidebar{width:190px;flex-basis:190px}.main{padding:23px 18px 50px}.metric .value{font-size:25px}.metric .value.money{font-size:20px}}
@media(max-width:760px){.app{display:block}.sidebar{position:static;width:auto;height:auto;padding:13px 15px}.brand{font-size:16px;padding:0 0 8px}.brand span,.sidebar-foot{display:none}.nav{display:flex;gap:5px;overflow-x:auto}.nav button{padding:9px 12px;white-space:nowrap;font-size:12px}.main{padding:17px 12px 44px}.topline{margin-bottom:14px}.topline h1{font-size:21px}.date-pill{display:none}.hero{padding:18px;gap:10px}.hero h2{font-size:18px}.hero-stat strong{font-size:27px}.hero-stat{min-width:90px}.grid3{gap:7px}.metric{padding:12px 9px;min-height:105px}.metric .label{font-size:10px}.metric .value{font-size:21px}.metric .value.money{font-size:15px;letter-spacing:-.7px}.metric .sub{font-size:10px}.grid2,.form-grid{grid-template-columns:1fr}.card{padding:16px}.section-head{align-items:start;flex-wrap:wrap}.cal-grid{grid-template-columns:repeat(auto-fit,minmax(245px,1fr))}}
@media(max-width:400px){.hero{flex-direction:column;align-items:start}.hero-stat{text-align:left}.metric .value.money{font-size:14px}.metric .value{font-size:19px}}
</style>

<body>
<div class="app">
<aside class="sidebar"><div class="brand">📚 기출 15회독 플래너<span>STUDY PROGRESS &amp; VALUE</span></div><nav class="nav" id="nav" aria-label="주요 메뉴"></nav><div class="sidebar-foot">같은 문제를 반복해 풀어도 매번 누적됩니다.<br />기록은 이 브라우저에 저장됩니다.</div></aside>
<main class="main" id="main" aria-live="polite"></main>
</div>
<script>
'use strict';
const KEY='exam-15round-planner-v3';
const TODAY=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const newId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const int=(x,def=0)=>Number.isFinite(Number(x))?Math.max(0,Math.floor(Number(x))):def;
const nfmt=x=>Math.round(x).toLocaleString('ko-KR');
const money=x=>(x>0?'+':x<0?'−':'')+nfmt(Math.abs(x))+'원';
const parseDate=s=>{if(!/^\d{4}-\d\d-\d\d$/.test(s||''))return null;let [y,m,d]=s.split('-').map(Number),v=new Date(y,m-1,d);return v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d?v:null};
const dnum=s=>{const d=parseDate(s);return d?Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000:NaN};
const fromNum=n=>{const d=new Date(n*86400000);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`};
const addDays=(s,n)=>fromNum(dnum(s)+n);
const daysBetween=(a,b)=>dnum(b)-dnum(a);
const SUBJECTS={nurse:['국어','영어','지역사회간호','간호관리','LEET 추리논증'],admin:['국어','영어','행정법','행정학','LEET 추리논증']};
const SUBJECT_ALL=['국어','영어','지역사회간호','간호관리','행정법','행정학','LEET 추리논증'];
function initialPapers(){let out=[];function add(subject,year,type,questions){out.push({id:newId(),subject,year,type,questions})}for(let y=2016;y<=2026;y++){for(let subject of ['국어','영어']){add(subject,y,'국가직 9급',20);add(subject,y,'지방직 9급',20)}for(let subject of ['지역사회간호','간호관리','행정법','행정학'])add(subject,y,'연도별 기출',20)}for(let y=2021;y<=2026;y++)add('LEET 추리논증',y,'추리논증',40);return out}
function defaults(){const today=TODAY();return {version:3,mode:'nurse',startDate:today,targetDate:addDays(today,200),isOfficialExamDate:false,rounds:15,monthlySalary:220,monthlyChildcare:0,pastYears:0,pastAnnualCost:0,futureAnnualCost:100,papers:initialPapers(),entries:[],restDates:[]}}
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||db.version!==3||!Array.isArray(db.papers)||!Array.isArray(db.entries)){db=defaults()}
let tab='dashboard', logSubject='국어', logPaper='', logDate=TODAY(), paperFilter='국어', saveFailed=false;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));saveFailed=false}catch(e){saveFailed=true}}
function subjects(){return SUBJECTS[db.mode]}
function activePapers(){return db.papers.filter(p=>subjects().includes(p.subject))}
function targetBase(){return activePapers().reduce((a,p)=>a+int(p.questions),0)}
function targetTotal(){return targetBase()*int(db.rounds,15)}
function activeEntries(){return db.entries.filter(e=>subjects().includes(e.subject))}
function totalSolved(){return activeEntries().reduce((a,e)=>a+int(e.count),0)}
function solvedOn(date){return activeEntries().filter(e=>e.date===date).reduce((a,e)=>a+int(e.count),0)}
function plannedDays(){return Math.max(1,daysBetween(db.startDate,db.targetDate)||1)}
function fixedDailyGoal(){return Math.max(1,Math.ceil(targetTotal()/plannedDays()))}
function remainingDays(){return Math.max(0,daysBetween(TODAY(),db.targetDate))}
function remainingGoal(){return Math.max(0,targetTotal()-totalSolved())}
function neededDaily(){return remainingDays()?Math.ceil(remainingGoal()/remainingDays()):remainingGoal()}
function dailyBase(){return Math.max(0,(Number(db.monthlySalary)||0)-(Number(db.monthlyChildcare)||0))*10000/30}
function isRest(date){return db.restDates.includes(date)}
function validPlanDay(date){return dnum(date)>=dnum(db.startDate)&&dnum(date)<dnum(db.targetDate)}
function dailyMoney(date){if(!validPlanDay(date)||isRest(date))return 0;return Math.round(dailyBase()*(solvedOn(date)/fixedDailyGoal()-1))}
function cumulativeMoney(){const start=dnum(db.startDate),end=Math.min(dnum(TODAY()),dnum(db.targetDate)-1);if(!Number.isFinite(start)||end<start)return 0;let total=0;for(let d=start;d<=end&&d<start+3650;d++)total+=dailyMoney(fromNum(d));return total}
function percent(a,b){return b?100*a/b:0}
function progressBar(p,green=false){return `<div class="progress ${green?'green':''}"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div>`}
function subjectTotal(s){return db.papers.filter(p=>p.subject===s).reduce((a,p)=>a+int(p.questions),0)*db.rounds}
function subjectSolved(s){return db.entries.filter(e=>e.subject===s).reduce((a,e)=>a+int(e.count),0)}
function dateLabel(date){const d=parseDate(date);return d?`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`:date}
function navHTML(){const tabs=[['dashboard','◫ 대시보드'],['log','✎ 풀이 기록'],['calendar','▦ 시험 달력'],['cost','₩ 기회비용'],['settings','⚙ 설정·백업']];return tabs.map(([id,name])=>`<button type="button" data-nav="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}>${name}</button>`).join('')}
function shell(title,eyebrow,body){$('nav').innerHTML=navHTML();$('main').innerHTML=`<div class="topline"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="date-pill">${dateLabel(TODAY())}</div></div>${body}<p class="footer-note">${saveFailed?'⚠ 저장 공간이 부족하거나 차단되었습니다. JSON 백업을 내려받으세요.':'● 이 브라우저에 자동 저장 중'} · 학습 금액은 실제 수익·손실이 아닌 목표 달성률 기반 가상 지표입니다.</p>`}
function dashboard(){const today=TODAY(),todayCount=solvedOn(today),dailyGoal=fixedDailyGoal(),dayPct=percent(todayCount,dailyGoal),dMoney=dailyMoney(today),cum=cumulativeMoney(),done=totalSolved(),goal=targetTotal(),allPct=percent(done,goal),left=remainingDays();const cards=subjects().map(s=>{const g=subjectTotal(s),v=subjectSolved(s),p=percent(v,g);return `<div class="subject-tile"><b>${esc(s)}</b>${progressBar(p)}<div class="nums">${nfmt(v)} / ${nfmt(g)}문항 · ${p.toFixed(1)}%</div></div>`}).join('');const trend=Array.from({length:14},(_,i)=>addDays(today,i-13));const trendHtml=trend.map(d=>{let c=solvedOn(d),height=Math.max(2,Math.min(100,percent(c,dailyGoal)));return `<div class="bar-col" title="${d}: ${c}문항"><i class="${c>=dailyGoal?'hit':''}" style="height:${height}%"></i><span>${d.slice(8)}</span></div>`}).join('');const last=activeEntries().slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,5);const lastHTML=last.length?last.map(e=>`<div class="mini-row"><span>${esc(e.date.slice(5))} · ${esc(e.subject)} · ${esc(e.year)} ${esc(e.type)}</span><strong>+${nfmt(e.count)}문항</strong></div>`).join(''):'<div class="empty">아직 풀이 기록이 없습니다. 첫 문제를 기록해 보세요.</div>';shell('오늘의 공부 현황','MY STUDY DASHBOARD',`<section class="hero"><div><span class="tag">${db.mode==='nurse'?'간호직 준비':'일반행정직 준비'}</span><h2>200일 계획을 매일의 기록으로</h2><p>15회독 목표 · ${nfmt(goal)}문항 · 현재 ${nfmt(done)}문항 풀이</p></div><div class="hero-stat"><strong>${left>0?'D-'+left:left===0?'D-DAY':'D+'+Math.abs(daysBetween(today,db.targetDate))}</strong><span>${db.isOfficialExamDate?'입력한 시험일 기준':'임시 계획 종료일까지'}</span></div></section><div class="grid3"><div class="metric"><div class="label">당일 학습 진도율</div><div class="value">${dayPct.toFixed(1)}%</div><div class="sub">${nfmt(todayCount)} / ${nfmt(dailyGoal)}문항</div></div><div class="metric ${dMoney>0?'positive':dMoney<0?'negative':''}"><div class="label">일일 가상 손익</div><div class="value money">${money(dMoney)}</div><div class="sub">오늘 진행 중 · 목표 대비</div></div><div class="metric ${cum>0?'positive':cum<0?'negative':''}"><div class="label">누적 가상 손익</div><div class="value money">${money(cum)}</div><div class="sub">준비 시작일부터 오늘까지</div></div></div><section class="card"><div class="section-head"><div><h2>15회독 전체 달성률</h2><p>같은 문제를 다시 풀어도 매번 누적됩니다.</p></div><span class="tag">${allPct.toFixed(2)}%</span></div>${progressBar(allPct)}<div class="progress-top"><b>${nfmt(done)} <small>/ ${nfmt(goal)}문항</small></b><span>남은 ${nfmt(remainingGoal())}문항</span></div><div class="inline-stat"><span>1회독 분량 <b>${nfmt(targetBase())}문항</b></span><span>환산 회독 <b>${(targetBase()?done/targetBase():0).toFixed(2)} / ${db.rounds}회</b></span><span>고정 일일 목표 <b>${nfmt(dailyGoal)}문항</b></span><span>남은 기간 맞춤 목표 <b>${nfmt(neededDaily())}문항/일</b></span></div></section><section class="card"><div class="section-head"><h2>과목별 누적 진도</h2><button class="btn small" data-nav="log">문제 풀이 기록 →</button></div><div class="subjects-grid">${cards}</div></section><div class="grid2"><section class="card"><div class="section-head"><h2>최근 14일 풀이량</h2><span class="tag gray">하루 목표 ${dailyGoal}문항</span></div><div class="bar-chart">${trendHtml}</div><p class="muted" style="font-size:12px">초록색 막대는 하루 목표 이상 달성한 날입니다.</p></section><section class="card"><div class="section-head"><h2>최근 풀이 기록</h2><button class="btn small" data-nav="log">전체 보기</button></div><div class="mini-list">${lastHTML}</div></section></div><section class="card"><div class="note warn">일일 금액은 <b>(오늘 풀이 문항 ÷ 하루 목표 − 1) × 하루 기준금액</b>으로 계산합니다. 목표 100%면 0원, 초과하면 플러스, 미달하면 마이너스입니다. 오늘의 마이너스는 공부가 끝나기 전까지 <b>잠정값</b>이며, 지정한 휴식일은 0원 처리됩니다.</div></section>`)}
function paperOptions(subject,selected){return db.papers.filter(p=>p.subject===subject).sort((a,b)=>b.year-a.year||a.type.localeCompare(b.type)).map(p=>`<option value="${esc(p.id)}" ${selected===p.id?'selected':''}>${p.year}년 ${esc(p.type)} · ${p.questions}문항</option>`).join('')}
function logView(){if(!subjects().includes(logSubject))logSubject=subjects()[0];const list=db.papers.filter(p=>p.subject===logSubject);if(!list.some(p=>p.id===logPaper))logPaper=list[0]?.id||'';const p=db.papers.find(p=>p.id===logPaper);const history=activeEntries().slice().sort((a,b)=>(b.date+b.createdAt).localeCompare(a.date+a.createdAt)).slice(0,35);const hist=history.length?history.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.subject)}</td><td>${esc(e.year)} ${esc(e.type)}</td><td class="right">${nfmt(e.count)}문항</td><td class="right">${e.correct===null||e.correct===undefined?'—':nfmt(e.correct)+'개'}</td><td class="right"><button class="btn small danger" data-remove-entry="${esc(e.id)}">삭제</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">풀이 기록이 없습니다.</td></tr>';if(!subjects().includes(paperFilter))paperFilter=subjects()[0];const papers=db.papers.filter(p=>p.subject===paperFilter).sort((a,b)=>b.year-a.year||a.type.localeCompare(b.type));const listHtml=papers.map(p=>{const v=db.entries.filter(e=>e.paperId===p.id).reduce((a,e)=>a+int(e.count),0),equiv=p.questions?v/p.questions:0;return `<div class="paper"><div><strong>${p.year}년 ${esc(p.type)}</strong><small>${p.questions}문항 · 누적 ${nfmt(v)}문항 · ${equiv.toFixed(1)}회분</small></div><div class="paper-actions"><button class="btn" data-pick-paper="${esc(p.id)}" title="이 시험지 기록하기">기록</button><button class="btn" data-edit-paper="${esc(p.id)}" title="문항 수·시험 종류 수정">수정</button><button class="btn danger" data-delete-paper="${esc(p.id)}" title="시험지 목록에서 삭제">×</button></div></div>`}).join('');shell('기출문제 풀이 기록','QUESTION LOG',`<section class="card"><div class="section-head"><div><h2>풀이 기록 추가</h2><p>동일 시험지라도 여러 번 기록할 수 있어요. 누적 풀이 횟수만큼 진도에 반영됩니다.</p></div><span class="tag">1회분 ${p?.questions||20}문항</span></div><form id="logForm"><div class="form-grid"><div class="field"><label for="logDate">풀이 날짜</label><input id="logDate" type="date" required value="${esc(logDate)}"></div><div class="field"><label for="logSubject">과목</label><select id="logSubject">${subjects().map(s=>`<option ${s===logSubject?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="logPaper">기출 연도 · 시험</label><select id="logPaper" required>${paperOptions(logSubject,logPaper)}</select></div><div class="field"><label for="logCount">이번에 푼 문항 수</label><input id="logCount" type="number" min="1" max="10000" step="1" value="${p?.questions||20}" required></div><div class="field"><label for="logCorrect">맞힌 문항 수 (선택)</label><input id="logCorrect" type="number" min="0" max="10000" step="1" placeholder="비워도 됩니다"></div><div class="field"><label>&nbsp;</label><button class="btn primary full" type="submit">+ 풀이 기록 저장</button></div></div></form><div class="inline-stat"><span>오늘 풀이 <b>${nfmt(solvedOn(TODAY()))}문항</b></span><span>오늘 목표 <b>${nfmt(fixedDailyGoal())}문항</b></span><span>전체 누적 <b>${nfmt(totalSolved())}문항</b></span></div></section><section class="card"><div class="section-head"><div><h2>기출 시험지 목록</h2><p>국가직·지방직 9급, 일부 연도 7급, LEET 등을 자유롭게 추가할 수 있어요.</p></div><div class="field" style="min-width:140px"><label for="paperFilter">과목 보기</label><select id="paperFilter">${subjects().map(s=>`<option ${s===paperFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div><div class="paper-list">${listHtml||'<p class="empty">등록된 시험지가 없습니다.</p>'}</div><details><summary>+ 새로운 시험지 추가</summary><form id="paperForm" class="form-grid" style="margin-top:14px"><div class="field"><label for="paperSubject">과목</label><select id="paperSubject">${subjects().map(s=>`<option ${s===paperFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label for="paperYear">연도</label><input id="paperYear" type="number" min="1990" max="2100" value="2026" required></div><div class="field"><label for="paperType">시험 종류</label><input id="paperType" type="text" maxlength="60" placeholder="예: 지방직 7급" required></div><div class="field"><label for="paperQuestions">문항 수</label><input id="paperQuestions" type="number" min="1" max="500" value="20" required></div><div class="field"><label>&nbsp;</label><button class="btn primary" type="submit">시험지 추가</button></div></form></details></section><section class="card"><div class="section-head"><h2>최근 풀이 이력</h2><span class="tag gray">최근 35건</span></div><div class="table-scroll"><table class="data-table"><thead><tr><th>날짜</th><th>과목</th><th>시험지</th><th class="right">풀이</th><th class="right">정답</th><th class="right">관리</th></tr></thead><tbody>${hist}</tbody></table></div></section>`)}
function monthHTML(year,month){const first=new Date(year,month,1),length=new Date(year,month+1,0).getDate();let html=`<div class="month"><h3>${year}년 ${month+1}월 <small>날짜 선택 → 기록</small></h3><div class="days">`;for(let w of ['일','월','화','수','목','금','토'])html+=`<div class="day head">${w}</div>`;for(let i=0;i<first.getDay();i++)html+='<div class="day blank"></div>';for(let d=1;d<=length;d++){let date=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n=solvedOn(date),cls=date===db.targetDate?'exam':isRest(date)?'rest':date<TODAY()?(n>=fixedDailyGoal()?'done':n>0?'partial':'past'):n>=fixedDailyGoal()?'done':n>0?'partial':'',today=date===TODAY()?'today':'';html+=`<button type="button" class="day ${cls} ${today}" data-day="${date}" title="${date} · ${n}문항${isRest(date)?' · 휴식일':''}">${d}</button>`}return html+'</div></div>'}
function calendarView(){const today=TODAY(),start=parseDate(today),end=parseDate(db.targetDate),months=[];let count=0;for(let y=start.getFullYear(),m=start.getMonth();count<24&&(y<end.getFullYear()||y===end.getFullYear()&&m<=end.getMonth());count++,m++){if(m===12){y++;m=0}months.push(monthHTML(y,m))}if(!months.length)months.push(monthHTML(start.getFullYear(),start.getMonth()));const totalDays=plannedDays(),elapsed=Math.max(0,Math.min(totalDays,daysBetween(db.startDate,today))),timePct=percent(elapsed,totalDays);shell('시험일까지 남은 달력','TIME REMAINING',`<section class="hero"><div><h2>남은 날짜를 한눈에</h2><p>지난 날은 회색, 남은 날은 파란색으로 표시됩니다.</p></div><div class="hero-stat"><strong>${remainingDays()}일</strong><span>${db.isOfficialExamDate?'설정한 시험일까지':'임시 계획 종료일까지'}</span></div></section><div class="grid3"><div class="metric"><div class="label">기간 경과율</div><div class="value">${timePct.toFixed(1)}%</div><div class="sub">${elapsed} / ${totalDays}일</div></div><div class="metric"><div class="label">15회독 달성률</div><div class="value">${percent(totalSolved(),targetTotal()).toFixed(1)}%</div><div class="sub">${nfmt(totalSolved())}문항 누적</div></div><div class="metric"><div class="label">남은 기간 필요량</div><div class="value">${nfmt(neededDaily())}</div><div class="sub">문항 / 남은 날</div></div></div><section class="card"><div class="section-head"><h2>월별 달력</h2><button class="btn small" data-nav="settings">날짜 수정</button></div><div class="legend"><span><i class="dot" style="background:#e8ebf0"></i>지난 날</span><span><i class="dot" style="background:#e5efff"></i>남은 날</span><span><i class="dot" style="background:#cceee1"></i>목표 달성</span><span><i class="dot" style="background:#fff0d6"></i>일부 학습</span><span><i class="dot" style="background:#dd5261"></i>목표일</span></div><div class="cal-grid">${months.join('')}</div>${count>=24?'<p class="muted" style="margin-top:12px">최대 24개월까지 표시합니다.</p>':''}</section><section class="card"><div class="section-head"><div><h2>휴식일 설정</h2><p>육아·가족 일정 등으로 쉬는 날은 가상 손익을 0원 처리합니다.</p></div></div><div class="form-grid"><div class="field"><label for="restDate">날짜 선택</label><input type="date" id="restDate" value="${today}"></div><div class="field"><label>&nbsp;</label><button class="btn" data-toggle-rest>선택 날짜 휴식일 전환</button></div></div><p class="muted" style="margin-top:12px">현재 휴식일: ${db.restDates.length?db.restDates.slice().sort().map(esc).join(', '):'없음'}</p></section>`)}
function costView(){const remain=remainingDays(),futureMonths=remain/30,annual=12*(Number(db.monthlySalary)-Number(db.monthlyChildcare))+Number(db.futureAnnualCost),future=(Number(db.monthlySalary)-Number(db.monthlyChildcare))*futureMonths+Number(db.futureAnnualCost)*futureMonths/12,sunk=Number(db.pastYears)*Number(db.pastAnnualCost),base=dailyBase(),day=TODAY(),pct=percent(solvedOn(day),fixedDailyGoal());shell('경제적 기회비용 분석','STUDY VALUE SIMULATOR',`<div class="grid3"><div class="metric"><div class="label">과거 실제 준비비 (매몰비용)</div><div class="value money">${nfmt(sunk)}만원</div><div class="sub">${db.pastYears}년 × 연 ${db.pastAnnualCost}만원</div></div><div class="metric"><div class="label">향후 1년 순기회비용 (가정)</div><div class="value money">${nfmt(annual)}만원</div><div class="sub">포기 소득 + 준비비 − 추가 돌봄비</div></div><div class="metric"><div class="label">남은 ${remain}일 순기회비용 (가정)</div><div class="value money">${nfmt(future)}만원</div><div class="sub">30일을 1개월로 환산</div></div></div><section class="card"><div class="section-head"><h2>오늘의 학습 손익 계산</h2><span class="tag gray">가상 지표</span></div><div class="grid2"><div><div class="muted">하루 가상 손익 기준금액</div><div class="money-big">${nfmt(base)}원</div><p class="muted">(월 실수령 − 추가 월 돌봄비) ÷ 30일</p></div><div><div class="muted">오늘 목표 달성률</div><div class="money-big">${pct.toFixed(1)}%</div><p class="muted">${nfmt(solvedOn(day))} / ${nfmt(fixedDailyGoal())}문항</p></div></div><div class="note" style="margin-top:16px">일일 가상 손익 = ${nfmt(base)}원 × (${nfmt(solvedOn(day))} ÷ ${nfmt(fixedDailyGoal())} − 1) = <b>${money(dailyMoney(day))}</b></div><div class="mini-list" style="margin-top:15px"><div class="mini-row"><span>일일 가상 손익</span><strong>${money(dailyMoney(day))}</strong></div><div class="mini-row"><span>누적 가상 손익</span><strong>${money(cumulativeMoney())}</strong></div></div></section><section class="card"><div class="section-head"><h2>계산 기준 설정</h2><button class="btn small" data-nav="settings">전체 설정 →</button></div><form id="moneyForm" class="form-grid"><div class="field"><label for="salary">취업 시 예상 월 실수령 (만원)</label><input id="salary" type="number" min="0" max="2000" value="${esc(db.monthlySalary)}"></div><div class="field"><label for="childcare">취업 시 추가 월 돌봄비 (만원)</label><input id="childcare" type="number" min="0" max="2000" value="${esc(db.monthlyChildcare)}"></div><div class="field"><label for="pastYears">과거 준비 기간 (년)</label><input id="pastYears" type="number" min="0" max="40" value="${esc(db.pastYears)}"></div><div class="field"><label for="pastAnnualCost">과거 연간 준비비 (만원)</label><input id="pastAnnualCost" type="number" min="0" max="5000" value="${esc(db.pastAnnualCost)}"></div><div class="field"><label for="futureAnnualCost">향후 연간 준비비 (만원)</label><input id="futureAnnualCost" type="number" min="0" max="5000" value="${esc(db.futureAnnualCost)}"></div><div class="field"><label>&nbsp;</label><button type="submit" class="btn primary full">계산 기준 저장</button></div></form></section><section class="card"><div class="note warn"><b>경제적 의미를 구분해야 합니다.</b> 월 실수령 220만원과 향후 연간 준비비 100만원은 예시값이므로 실제 상황에 맞게 수정하세요. 매몰비용은 이미 지출한 과거 준비비이며, 미래 의사결정에서 회수할 수 없습니다. 향후 기회비용은 대체 취업이 가능하다는 가정의 추정치입니다. 일일·누적 손익은 학습량을 표현한 게임형 지표로, 실제 수익이나 합격 확률을 의미하지 않습니다.</div></section>`)}
function settingsView(){shell('목표·과목·데이터 설정','PLAN SETTINGS',`<section class="card"><div class="section-head"><h2>기본 학습 계획</h2><span class="tag">자동 저장</span></div><form id="planForm"><div class="form-grid"><div class="field"><label for="mode">응시 직렬</label><select id="mode"><option value="nurse" ${db.mode==='nurse'?'selected':''}>간호직 (지역사회간호·간호관리)</option><option value="admin" ${db.mode==='admin'?'selected':''}>일반행정직 (행정법·행정학)</option></select></div><div class="field"><label for="rounds">최종 목표 회독</label><input type="number" id="rounds" min="1" max="1000" value="${db.rounds}" required></div><div class="field"><label for="startDate">공부 시작일</label><input type="date" id="startDate" value="${esc(db.startDate)}" required></div><div class="field"><label for="targetDate">목표 종료일 / 시험일</label><input type="date" id="targetDate" value="${esc(db.targetDate)}" required></div><div class="field"><label for="isOfficialExamDate">날짜 구분</label><select id="isOfficialExamDate"><option value="0" ${!db.isOfficialExamDate?'selected':''}>임시 계획 종료일</option><option value="1" ${db.isOfficialExamDate?'selected':''}>직접 확인한 시험일</option></select></div><div class="field"><label>&nbsp;</label><button class="btn primary full" type="submit">학습 계획 저장</button></div></div></form><div class="inline-stat"><span>현재 계획 <b>${plannedDays()}일</b></span><span>1회독 <b>${nfmt(targetBase())}문항</b></span><span>최종 목표 <b>${nfmt(targetTotal())}문항</b></span><span>하루 기준 <b>${nfmt(fixedDailyGoal())}문항</b></span></div><div class="note" style="margin-top:14px">기본값은 오늘부터 200일의 <b>임시 계획</b>입니다. 실제 시험일을 확인했다면 날짜를 직접 바꾸세요. 목표 종료일은 공부할 수 있는 마지막 날의 다음 날로 계산합니다(시험 당일 공부량 제외).</div></section><section class="card"><div class="section-head"><h2>기본 기출 구성</h2><button class="btn small" data-nav="log">시험지 관리 →</button></div><div class="mini-list">${subjects().map(s=>`<div class="mini-row"><span>${esc(s)}</span><strong>${db.papers.filter(p=>p.subject===s).length}회분 · ${nfmt(subjectTotal(s)/db.rounds)}문항/회독</strong></div>`).join('')}</div><div class="note" style="margin-top:14px">국어·영어: 2016~2026년 국가직·지방직 9급 각 20문항. 전문과목: 2016~2026년 연도별 20문항(시험 종류는 실제 자료에 맞게 수정). LEET: 임시로 2021~2026년 추리논증 각 40문항. 일부 연도 7급은 <b>풀이 기록 → 새로운 시험지 추가</b>에서 등록하세요.</div></section><section class="card"><div class="section-head"><h2>데이터 백업·복원</h2><span class="tag gray">기기별 저장</span></div><div class="button-row"><button class="btn primary" data-backup>JSON 전체 백업</button><button class="btn" data-export>풀이 이력 CSV</button><label class="btn" for="restoreFile" style="cursor:pointer">JSON 백업 복원</label><input id="restoreFile" type="file" accept=".json,application/json" class="hidden"></div><p class="muted" style="margin-top:13px">현재 기기·브라우저에만 저장됩니다. 휴대폰과 PC는 자동 동기화되지 않으며, 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다. 주기적으로 JSON 백업을 받아 주세요.</p></section><section class="card"><div class="danger-zone"><h3>처음부터 다시 시작</h3><p class="muted" style="margin:8px 0 12px">모든 풀이 기록, 시험지 구성, 설정이 초기화됩니다. 먼저 백업을 권장합니다.</p><button class="btn danger" data-reset>모든 데이터 초기화</button></div></section>`)}
function render(){if(tab==='dashboard')dashboard();else if(tab==='log')logView();else if(tab==='calendar')calendarView();else if(tab==='cost')costView();else settingsView()}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
function download(name,content,type){const blob=new Blob(['\ufeff',content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function record(paperId,count,date,correct=null){const p=db.papers.find(p=>p.id===paperId);if(!p)throw Error('시험지를 찾을 수 없습니다.');if(!subjects().includes(p.subject))throw Error('현재 직렬의 과목이 아닙니다.');if(!parseDate(date))throw Error('날짜를 확인하세요.');if(!Number.isInteger(count)||count<1||count>10000)throw Error('문항 수는 1~10,000 사이의 정수여야 합니다.');if(correct!==null&&(!Number.isInteger(correct)||correct<0||correct>count))throw Error('맞힌 문항 수는 풀이 문항 수 이하여야 합니다.');db.entries.push({id:newId(),date,paperId,subject:p.subject,year:p.year,type:p.type,count,correct,createdAt:new Date().toISOString()});save()}
function handleClick(e){const b=e.target.closest('[data-nav],[data-day],[data-pick-paper],[data-remove-entry],[data-edit-paper],[data-delete-paper],[data-toggle-rest],[data-backup],[data-export],[data-reset]');if(!b)return;
 if(b.dataset.nav){go(b.dataset.nav);return}
 if(b.dataset.day){logDate=b.dataset.day;go('log');return}
 if(b.dataset.pickPaper){const p=db.papers.find(p=>p.id===b.dataset.pickPaper);if(!p)return;logSubject=p.subject;logPaper=p.id;logDate=TODAY();render();$('logCount')?.focus();window.scrollTo({top:0,behavior:'smooth'});return}
 if(b.dataset.removeEntry){const x=db.entries.find(e=>e.id===b.dataset.removeEntry);if(x&&confirm(`${x.date} ${x.subject} ${x.count}문항 기록을 삭제할까요?`)){db.entries=db.entries.filter(e=>e.id!==x.id);save();render()}return}
 if(b.dataset.editPaper){const p=db.papers.find(p=>p.id===b.dataset.editPaper);if(!p)return;const type=prompt('시험 종류를 입력하세요.',p.type);if(type===null)return;const count=prompt('시험지 문항 수를 입력하세요.',p.questions);if(count===null)return;const year=prompt('시험 연도를 입력하세요.',p.year);if(year===null)return;const n=Number(count),y=Number(year);if(!type.trim()||!Number.isInteger(n)||n<1||n>500||!Number.isInteger(y)||y<1990||y>2100){alert('입력값을 확인하세요.');return}p.type=type.trim().slice(0,60);p.questions=n;p.year=y;save();render();return}
 if(b.dataset.deletePaper){const p=db.papers.find(p=>p.id===b.dataset.deletePaper);if(p&&confirm(`${p.year} ${p.type} 시험지를 목록에서 삭제할까요?\n기존 풀이 기록은 유지됩니다.`)){db.papers=db.papers.filter(x=>x.id!==p.id);if(logPaper===p.id)logPaper='';save();render()}return}
 if(b.hasAttribute('data-toggle-rest')){const d=$('restDate')?.value;if(!parseDate(d)){alert('올바른 날짜를 선택하세요.');return}db.restDates=db.restDates.includes(d)?db.restDates.filter(x=>x!==d):[...db.restDates,d];save();render();return}
 if(b.hasAttribute('data-backup')){download('exam-planner-backup-'+TODAY()+'.json',JSON.stringify(db,null,2),'application/json');return}
 if(b.hasAttribute('data-export')){const rows=[['날짜','과목','연도','시험 종류','풀이 문항','정답 문항','기록 ID'],...db.entries.map(e=>[e.date,e.subject,e.year,e.type,e.count,e.correct??'',e.id])];download('exam-planner-history-'+TODAY()+'.csv',rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv');return}
 if(b.hasAttribute('data-reset')){if(confirm('정말 모든 데이터를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')&&confirm('최종 확인: 현재 기록을 모두 초기화할까요?')){db=defaults();logPaper='';save();go('dashboard')}return}
}
function handleChange(e){if(e.target.id==='logSubject'){logSubject=e.target.value;logPaper=db.papers.find(p=>p.subject===logSubject)?.id||'';const select=$('logPaper');select.innerHTML=paperOptions(logSubject,logPaper);const p=db.papers.find(p=>p.id===logPaper);$('logCount').value=p?.questions||20;return}if(e.target.id==='logPaper'){logPaper=e.target.value;const p=db.papers.find(p=>p.id===logPaper);if(p)$('logCount').value=p.questions;return}if(e.target.id==='logDate'){logDate=e.target.value;return}if(e.target.id==='paperFilter'){paperFilter=e.target.value;render();return}if(e.target.id==='restoreFile'){const file=e.target.files?.[0];if(file)restore(file);return}}
async function restore(file){try{const data=JSON.parse(await file.text());if(data.version!==3||!Array.isArray(data.papers)||!Array.isArray(data.entries)||!Array.isArray(data.restDates)||!['nurse','admin'].includes(data.mode)||!parseDate(data.startDate)||!parseDate(data.targetDate)||daysBetween(data.startDate,data.targetDate)<=0||data.papers.length>10000||data.entries.length>100000)throw Error('지원하지 않는 백업 형식입니다.');for(const p of data.papers){if(!p.id||!SUBJECT_ALL.includes(p.subject)||!Number.isInteger(p.questions)||p.questions<1||p.questions>500||!Number.isInteger(p.year)||p.year<1990||p.year>2100||typeof p.type!=='string')throw Error('시험지 데이터가 잘못되었습니다.')}for(const e of data.entries){if(!e.id||!SUBJECT_ALL.includes(e.subject)||!parseDate(e.date)||!Number.isInteger(e.count)||e.count<1||e.count>10000)throw Error('풀이 이력이 잘못되었습니다.')}if(!confirm('현재 모든 기록을 백업 데이터로 교체할까요?'))return;db=data;save();go('dashboard')}catch(err){alert('복원 실패: '+err.message)}finally{if($('restoreFile'))$('restoreFile').value=''}}
function handleSubmit(e){if(!['logForm','paperForm','moneyForm','planForm'].includes(e.target.id))return;e.preventDefault();const f=e.target.id;
 if(f==='logForm'){try{const date=$('logDate').value,pid=$('logPaper').value,count=Number($('logCount').value),raw=$('logCorrect').value.trim(),correct=raw===''?null:Number(raw);record(pid,count,date,correct);logDate=date;logPaper=pid;alert(`${nfmt(count)}문항 풀이가 누적되었습니다.`);render()}catch(err){alert(err.message)}return}
 if(f==='paperForm'){const subject=$('paperSubject').value,year=Number($('paperYear').value),type=$('paperType').value.trim(),questions=Number($('paperQuestions').value);if(!subjects().includes(subject)||!Number.isInteger(year)||year<1990||year>2100||!type||!Number.isInteger(questions)||questions<1||questions>500){alert('시험지 정보를 확인하세요.');return}if(db.papers.some(p=>p.subject===subject&&p.year===year&&p.type===type)){alert('동일한 시험지가 이미 있습니다.');return}db.papers.push({id:newId(),subject,year,type:type.slice(0,60),questions});paperFilter=subject;save();render();return}
 if(f==='moneyForm'){for(let id of ['salary','childcare','pastYears','pastAnnualCost','futureAnnualCost']){const val=Number($(id).value);if(!Number.isFinite(val)||val<0||val>5000){alert('금액을 확인하세요.');return}}db.monthlySalary=Number($('salary').value);db.monthlyChildcare=Number($('childcare').value);db.pastYears=Number($('pastYears').value);db.pastAnnualCost=Number($('pastAnnualCost').value);db.futureAnnualCost=Number($('futureAnnualCost').value);save();render();return}
 if(f==='planForm'){const start=$('startDate').value,end=$('targetDate').value,rounds=Number($('rounds').value);if(!parseDate(start)||!parseDate(end)||daysBetween(start,end)<=0||!Number.isInteger(rounds)||rounds<1||rounds>1000){alert('시작일보다 늦은 목표 종료일과 올바른 회독 수를 입력하세요.');return}db.mode=$('mode').value;db.startDate=start;db.targetDate=end;db.rounds=rounds;db.isOfficialExamDate=$('isOfficialExamDate').value==='1';if(!subjects().includes(logSubject))logSubject=subjects()[0];if(!subjects().includes(paperFilter))paperFilter=subjects()[0];logPaper='';save();render();return}}
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('submit',handleSubmit);save();render();
</script>
</body>
